syntax = "proto3";

package api.v1;

import "api/v1/shared.proto";

import "google/protobuf/timestamp.proto";

import "buf/validate/validate.proto";

service WorkoutService {
  rpc CreateWorkout (CreateWorkoutRequest) returns (CreateWorkoutResponse) {}
  rpc GetWorkout (GetWorkoutRequest) returns (GetWorkoutResponse) {}
  rpc ListWorkouts (ListWorkoutsRequest) returns (ListWorkoutsResponse) {}
  rpc DeleteWorkout (DeleteWorkoutRequest) returns (DeleteWorkoutResponse) {}
  rpc PostComment (PostCommentRequest) returns (PostCommentResponse) {}
  rpc UpdateWorkout (UpdateWorkoutRequest) returns (UpdateWorkoutResponse) {}
}

message CreateWorkoutRequest {
  // Optional: a quick workout follows no routine and so names none.
  string routine_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED
  ];
  repeated ExerciseSets exercise_sets = 2 [(buf.validate.field).repeated.min_items = 1];
  google.protobuf.Timestamp started_at = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp finished_at = 4 [(buf.validate.field).required = true];
  string note = 5;
  // Optional: a session trained outside a plan names none.
  string plan_id = 6 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED
  ];
  string workout_name = 7;
  // Optional. The blocks the session was trained in, which say how to read the
  // sets rather than carrying them: a block states how many of each exercise's
  // sets it took, and the groups are matched against exercise_sets in the order
  // they are listed. A request that names none is stored ungrouped, which is
  // what every client sent before blocks were recorded.
  repeated WorkoutGroup groups = 8;
  // Optional. A key the client mints once per session and sends with every
  // attempt to save it, so a save the server committed but never answered is
  // recognised when it is sent again and answered with the workout it already
  // has rather than saved twice. Unique per user.
  optional string idempotency_key = 9 [(buf.validate.field).string.uuid = true];
}
message CreateWorkoutResponse {
  string workout_id = 1;
}

message ListWorkoutsRequest {
  repeated string user_ids = 1 [(buf.validate.field).repeated = { min_items: 1, items: { string: { uuid: true }}}];
  PaginationRequest pagination = 2 [(buf.validate.field).required = true];
}
message ListWorkoutsResponse {
  repeated Workout workouts = 1;
  PaginationResponse pagination = 2;
}

message GetWorkoutRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetWorkoutResponse {
  Workout workout = 1;
}

message DeleteWorkoutRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteWorkoutResponse {}

message PostCommentRequest {
  string workout_id = 1 [(buf.validate.field).string.uuid = true];
  string comment = 2 [(buf.validate.field).string.min_len = 1];
}
message PostCommentResponse {
  WorkoutComment comment = 1;
}

message UpdateWorkoutRequest {
  Workout workout = 1 [(buf.validate.field).required = true];
}
message UpdateWorkoutResponse {}

message Workout {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  User user = 3 [(buf.validate.field).required = true];
  repeated ExerciseSets exercise_sets = 4 [(buf.validate.field).repeated.min_items = 1];
  repeated WorkoutComment comments = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp finished_at = 7 [(buf.validate.field).required = true];
  int32 intensity = 8; // intensity = (kg * reps) * sets
  string note = 9;
  // Empty for quick workouts and for workouts recorded before routines were
  // linked, which only kept the routine's name.
  string routine_id = 10;
  // How the session was trained, as it was trained: the workout keeps its own
  // copy rather than reading the routine's, so a routine edited later cannot
  // rewrite what happened. Groups partition the same sets exercise_sets holds;
  // a client that does not care how the session was blocked keeps reading only
  // that. Empty for every workout logged before blocks were recorded.
  repeated WorkoutGroup groups = 11;
}

// One block of a finished workout, as it was actually trained.
message WorkoutGroup {
  // Server-assigned; requests leave it empty.
  string id = 1;
  RoutineGroupMode mode = 2;
  int32 rest_between_exercises_seconds = 3 [(buf.validate.field).int32 = {gte: 0, lte: 3600}];
  int32 rest_between_rounds_seconds = 4 [(buf.validate.field).int32 = {gte: 0, lte: 3600}];
  // The rounds the routine prescribed, which the session may have gone over or
  // stopped short of; 0 is an open-ended circuit. How many were actually worked
  // is read off the sets.
  int32 rounds = 5 [(buf.validate.field).int32 = {gte: 0, lte: 99}];
  repeated WorkoutGroupExercise exercises = 6;
}

// One exercise where a block trained it, and the sets it took there. The same
// exercise in another block is a different occurrence with sets of its own.
message WorkoutGroupExercise {
  Exercise exercise = 1;
  // Read back with the workout; a request leaves it empty and states set_count,
  // because the sets themselves travel in exercise_sets and one copy of them on
  // the wire is enough.
  repeated Set sets = 2;
  // Requests only: how many of this exercise's sets the block took.
  int32 set_count = 3 [(buf.validate.field).int32.gte = 0];
}

message WorkoutComment {
  string id = 1 [(buf.validate.field).string.uuid = true];
  User user = 2 [(buf.validate.field).required = true];
  string comment = 4 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp created_at = 5 [(buf.validate.field).required = true];
}
