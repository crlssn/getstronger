syntax = "proto3";

package api.v1;

import "api/v1/shared.proto";

import "buf/validate/validate.proto";

service UserService {
  rpc GetUser (GetUserRequest) returns (GetUserResponse) {}
  rpc FollowUser (FollowUserRequest) returns (FollowUserResponse) {}
  rpc UnfollowUser (UnfollowUserRequest) returns (UnfollowUserResponse) {}
  rpc ListFollowers (ListFollowersRequest) returns (ListFollowersResponse) {}
  rpc ListFollowees (ListFolloweesRequest) returns (ListFolloweesResponse) {}
  rpc SearchUsers (SearchUsersRequest) returns (SearchUsersResponse) {}
  rpc UpdateUserName (UpdateUserNameRequest) returns (UpdateUserNameResponse) {}
  rpc UpdateUserUsername (UpdateUserUsernameRequest) returns (UpdateUserUsernameResponse) {}
  rpc UpdateUserAutofillSets (UpdateUserAutofillSetsRequest) returns (UpdateUserAutofillSetsResponse) {}
  rpc UpdateUserWeightUnit (UpdateUserWeightUnitRequest) returns (UpdateUserWeightUnitResponse) {}
  rpc UpdateUserDistanceUnit (UpdateUserDistanceUnitRequest) returns (UpdateUserDistanceUnitResponse) {}
}

message GetUserRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetUserResponse {
  User user = 1;
}

message FollowUserRequest {
  string follow_id = 1 [(buf.validate.field).string.uuid = true];
}
message FollowUserResponse {}

message UnfollowUserRequest {
  string unfollow_id = 1 [(buf.validate.field).string.uuid = true];
}
message UnfollowUserResponse {}

message ListFollowersRequest {
  string follower_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListFollowersResponse {
  repeated User followers = 1;
}

message ListFolloweesRequest {
  string followee_id = 1 [(buf.validate.field).string.uuid = true];
}
message ListFolloweesResponse {
  repeated User followees = 1;
}

message SearchUsersRequest {
  string query = 1 [(buf.validate.field).string.min_len = 3];
  PaginationRequest pagination = 2 [(buf.validate.field).required = true];
}
message SearchUsersResponse {
  repeated User users = 1;
  PaginationResponse pagination = 2;
}

message UpdateUserNameRequest {
  // Free-form and stored trimmed, matching the name given at signup.
  string name = 1 [(buf.validate.field).string.min_len = 1];
}
message UpdateUserNameResponse {
  User user = 1;
}

message UpdateUserUsernameRequest {
  // Compared case-insensitively; the server stores it lowercased.
  string username = 1 [(buf.validate.field).string = {
    min_len: 3
    max_len: 30
    pattern: "^[A-Za-z0-9_.]+$"
  }];
}
message UpdateUserUsernameResponse {
  User user = 1;
}

message UpdateUserWeightUnitRequest {
  WeightUnit weight_unit = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message UpdateUserWeightUnitResponse {
  User user = 1;
}

message UpdateUserAutofillSetsRequest {
  bool enabled = 1;
}
message UpdateUserAutofillSetsResponse {
  User user = 1;
}

message UpdateUserDistanceUnitRequest {
  DistanceUnit distance_unit = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message UpdateUserDistanceUnitResponse {
  User user = 1;
}
