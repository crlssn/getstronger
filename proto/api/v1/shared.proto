syntax = "proto3";

package api.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

message ExerciseSet {
  Exercise exercise = 1 [(buf.validate.field).required = true];
  Set set = 2 [(buf.validate.field).required = true];
}

message ExerciseSets {
  Exercise exercise = 1 [(buf.validate.field).required = true];
  repeated Set sets = 2 [(buf.validate.field).repeated.min_items = 1];
}

message Exercise {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string user_id = 2;
  string name = 3;
  repeated string tags = 4 [(buf.validate.field).repeated = {
    max_items: 10
    unique: true
    items: {
      string: {
        min_len: 1
        max_len: 64
      }
    }
  }];
  repeated ExerciseMetric metrics = 5 [(buf.validate.field).repeated = {
    unique: true
    items: { enum: { defined_only: true not_in: [0] } }
  }];
  int32 rest_seconds = 6 [(buf.validate.field).int32 = { gte: 0, lte: 3600 }];
}

enum ExerciseMetric {
  EXERCISE_METRIC_UNSPECIFIED = 0;
  EXERCISE_METRIC_WEIGHT = 1;
  EXERCISE_METRIC_REPS = 2;
  EXERCISE_METRIC_DISTANCE = 3;
  EXERCISE_METRIC_TIME = 4;
}

enum WeightUnit {
  WEIGHT_UNIT_UNSPECIFIED = 0;
  WEIGHT_UNIT_KILOGRAMS = 1;
  WEIGHT_UNIT_POUNDS = 2;
}

enum DistanceUnit {
  DISTANCE_UNIT_UNSPECIFIED = 0;
  DISTANCE_UNIT_KILOMETERS = 1;
  DISTANCE_UNIT_MILES = 2;
}

message Set {
  string id = 1;
  double weight = 2; // The weight can be less than zero.
  int32 reps = 3 [(buf.validate.field).int32 = { gte: 0 }];
  MetadataSet metadata = 4;
  double distance = 5 [(buf.validate.field).double = { gte: 0 }];
  int32 duration_seconds = 6 [(buf.validate.field).int32 = { gte: 0 }];
  WeightUnit weight_unit = 7 [(buf.validate.field).enum.defined_only = true];
  DistanceUnit distance_unit = 8 [(buf.validate.field).enum.defined_only = true];
}

message MetadataSet {
  string workout_id = 1 [(buf.validate.field).string.uuid = true];
  google.protobuf.Timestamp created_at = 2;
  bool personal_best = 3;
}

message User {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string first_name = 2 [(buf.validate.field).string.min_len = 1];
  string last_name = 3 [(buf.validate.field).string.min_len = 1];
  string email = 4;
  bool followed = 5;
  WeightUnit weight_unit = 6 [(buf.validate.field).enum.defined_only = true];
  DistanceUnit distance_unit = 7 [(buf.validate.field).enum.defined_only = true];
}

message PaginationRequest {
  int32 page_limit = 1 [(buf.validate.field).int32 = { gte: 1, lte: 100 }];
  bytes page_token = 2;
}

message PaginationResponse {
  bytes next_page_token = 1;
}
