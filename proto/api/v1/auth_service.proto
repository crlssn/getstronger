syntax = "proto3";

package api.v1;

import "api/v1/options.proto";

import "buf/validate/validate.proto";

service AuthService {
  rpc Signup (SignupRequest) returns (SignupResponse) {}
  rpc Login (LoginRequest) returns (LoginResponse) {}
  rpc RefreshToken (RefreshTokenRequest) returns (RefreshTokenResponse) {}
  rpc Logout (LogoutRequest) returns (LogoutResponse) {}
  rpc VerifyEmail (VerifyEmailRequest) returns (VerifyEmailResponse) {}
  rpc ResendVerificationEmail (ResendVerificationEmailRequest) returns (ResendVerificationEmailResponse) {}
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse) {}
  rpc UpdatePassword (UpdatePasswordRequest) returns (UpdatePasswordResponse) {}
  rpc DeleteAccount (DeleteAccountRequest) returns (DeleteAccountResponse) {
    option (auth) = true;
  }
}

message SignupRequest {
  // Units are no longer chosen here: every account starts metric and changes
  // them in the profile.
  reserved 4, 5, 6, 7;
  reserved "first_name", "last_name", "weight_unit", "distance_unit";

  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 6];
  string password_confirmation = 3;
  string name = 8 [(buf.validate.field).string.min_len = 1];
  // Compared case-insensitively; the server stores it lowercased.
  string username = 9 [(buf.validate.field).string = {
    min_len: 3
    max_len: 30
    pattern: "^[A-Za-z0-9_.]+$"
  }];
}
message SignupResponse {}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string.min_len = 1];
}
message LoginResponse {
  string access_token = 1;
}

message RefreshTokenRequest {}
message RefreshTokenResponse {
  string access_token = 1;
}

message LogoutRequest {}
message LogoutResponse {}

message VerifyEmailRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message VerifyEmailResponse {}

message ResendVerificationEmailRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}
// The response is deliberately identical for every request so that it never
// discloses whether an email address is registered or already verified.
message ResendVerificationEmailResponse {
  int32 retry_after_seconds = 1;
}

message ResetPasswordRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}
message ResetPasswordResponse {}

message UpdatePasswordRequest {
  string token = 1 [(buf.validate.field).string.uuid = true];
  string password = 2 [(buf.validate.field).string.min_len = 6];
  string password_confirmation = 3;
}
message UpdatePasswordResponse {}

// Deleting an account erases it and everything it owns, so the current
// password is re-entered to prove the phone's owner asked for it.
message DeleteAccountRequest {
  string password = 1 [(buf.validate.field).string.min_len = 1];
}
message DeleteAccountResponse {}
