syntax = "proto3";

package api.v1;

import "api/v1/shared.proto";
import "api/v1/workout_service.proto";

import "buf/validate/validate.proto";

service RoutineService {
  rpc CreateRoutine(CreateRoutineRequest) returns (CreateRoutineResponse) {}
  rpc GetRoutine (GetRoutineRequest) returns (GetRoutineResponse) {}
  rpc UpdateRoutine (UpdateRoutineRequest) returns (UpdateRoutineResponse) {}
  rpc DeleteRoutine (DeleteRoutineRequest) returns (DeleteRoutineResponse) {}
  rpc ListRoutines (ListRoutinesRequest) returns (ListRoutinesResponse) {}
  rpc AddExercise (AddExerciseRequest) returns (AddExerciseResponse) {}
  rpc UpdateExerciseOrder (UpdateExerciseOrderRequest) returns (UpdateExerciseOrderResponse) {}
  rpc GetDashboard (GetDashboardRequest) returns (GetDashboardResponse) {}
  rpc CreatePlan (CreatePlanRequest) returns (CreatePlanResponse) {}
  rpc GetPlan (GetPlanRequest) returns (GetPlanResponse) {}
  rpc ListPlans (ListPlansRequest) returns (ListPlansResponse) {}
  rpc UpdatePlan (UpdatePlanRequest) returns (UpdatePlanResponse) {}
  rpc DeletePlan (DeletePlanRequest) returns (DeletePlanResponse) {}
  rpc SetActivePlan (SetActivePlanRequest) returns (SetActivePlanResponse) {}
  rpc PauseActivePlan (PauseActivePlanRequest) returns (PauseActivePlanResponse) {}
  rpc SkipPlanRoutine (SkipPlanRoutineRequest) returns (SkipPlanRoutineResponse) {}
}

message CreateRoutineRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // A hundred is more exercises than a routine is ever trained with, and far
  // below the bind parameters the insert spends one of per id.
  repeated string exercise_ids = 2 [(buf.validate.field).repeated = { min_items: 1, max_items: 100, items: { string: { uuid: true }}}];
  // Optional. When set, it describes how exercise_ids are grouped; when empty,
  // the routine gets a single straight-sets group holding every exercise.
  repeated RoutineGroup groups = 3;
}
message CreateRoutineResponse {
  string id = 1;
}

message GetRoutineRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetRoutineResponse {
  Routine routine = 1;
}

message UpdateRoutineRequest {
  Routine routine = 1 [(buf.validate.field).required = true];
}
message UpdateRoutineResponse {
  Routine routine = 1;
}

message DeleteRoutineRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteRoutineResponse {}

message ListRoutinesRequest {
  string name = 1 [(buf.validate.field).string.max_len = 100];
  PaginationRequest pagination = 2 [(buf.validate.field).required = true];
}
message ListRoutinesResponse {
  repeated Routine routines = 1;
  PaginationResponse pagination = 2;
}

message AddExerciseRequest {
  string routine_id = 1 [(buf.validate.field).string.uuid = true];
  string exercise_id = 2 [(buf.validate.field).string.uuid = true];
}
message AddExerciseResponse {}

message UpdateExerciseOrderRequest {
  string routine_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string exercise_ids = 2 [(buf.validate.field).repeated = { min_items: 1, max_items: 100, items: { string: { uuid: true }}}];
}
message UpdateExerciseOrderResponse {}

message GetDashboardRequest {
  // Optional: the empty string asks for whichever routine comes next.
  string preferred_routine_id = 1 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).ignore = IGNORE_IF_UNPOPULATED
  ];
}

message GetDashboardResponse {
  Routine next_routine = 1;
  repeated Routine routines = 2;
  int32 workouts_this_week = 3;
  double volume_this_week = 4;
  repeated ExerciseSet personal_bests = 5;
  // A preview of the log, not all of it: clients that want a lifetime figure
  // read workout_count.
  repeated Workout recent_workouts = 6;
  Plan active_plan = 7;
  // Every workout the athlete has ever logged, counted in the database rather
  // than measured off recent_workouts.
  int32 workout_count = 8;
  // Kilometres covered this week: the unit every set is stored in, whatever
  // unit it was entered in.
  double distance_this_week = 9;
}

message Routine {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  // Every exercise of the routine, in the order they are trained. Groups
  // partition this same list; a client that does not care how the routine is
  // grouped can keep reading only this field.
  repeated Exercise exercises = 3 [(buf.validate.field).repeated.min_items = 1];
  repeated RoutineGroup groups = 4;
}

message RoutineGroup {
  // Server-assigned. Requests may leave it empty: a save replaces a routine's
  // groups wholesale rather than matching them up by ID.
  string id = 1;
  RoutineGroupMode mode = 2;
  // 3 held a round count that was never a target, only a limit.
  reserved 3;
  // Rest taken on the way from one exercise to the next inside a round.
  int32 rest_between_exercises_seconds = 4 [(buf.validate.field).int32 = {gte: 0, lte: 3600}];
  // Rest taken once a round closes, before the group starts again.
  int32 rest_between_rounds_seconds = 5 [(buf.validate.field).int32 = {gte: 0, lte: 3600}];
  // 6 held the exercises without the rest each of them takes in this group.
  reserved 6;
  repeated RoutineExercise exercises = 7;
  // How many times a circuit is prescribed to go round; 0 runs it for as many
  // rounds as the session takes. A target rather than a limit: the session may
  // take another round or stop short of it. Ignored outside a circuit.
  int32 rounds = 8 [(buf.validate.field).int32 = {gte: 0, lte: 99}];
  // Where this block sits in an interval routine. Unspecified everywhere else,
  // which is every routine saved before intervals existed.
  RoutineGroupRole role = 9;
  // Whether the repeating block drops its last exercise on its final round, so
  // a walk-run does not end the session with a walk. Ignored outside it.
  bool skip_last_on_final_round = 10;
  // What the athlete named this block. Empty is a block that reads by its
  // position instead — "Block A", "Block B" — which is every block saved
  // before one could be named.
  string title = 11 [(buf.validate.field).string.max_len = 60];
}

// How the work of one occurrence is counted: in sets recovered between, against
// a clock that ends it, or by a distance covered however long it takes.
//
// Unspecified is every occurrence saved before a routine said, which the server
// reads as sets unless the occurrence carries a target duration.
enum RoutineExerciseTracking {
  ROUTINE_EXERCISE_TRACKING_UNSPECIFIED = 0;
  ROUTINE_EXERCISE_TRACKING_SETS = 1;
  ROUTINE_EXERCISE_TRACKING_TIMED = 2;
  ROUTINE_EXERCISE_TRACKING_DISTANCE = 3;
}

// One exercise where a routine trains it. The same exercise in another group,
// or in another routine, is a different occurrence and rests for its own length.
message RoutineExercise {
  Exercise exercise = 1;
  // How long this occurrence rests between sets; 0 turns the timer off here
  // alone. Ignored in a circuit, which rests between exercises and between
  // rounds instead.
  int32 rest_seconds = 2 [(buf.validate.field).int32 = {gte: 0, lte: 3600}];
  // Active time prescribed for each circuit round; zero means manual logging.
  int32 target_duration_seconds = 3 [(buf.validate.field).int32 = {gte: 0, lte: 86400}];
  // How this occurrence's work is counted. The three below are read one apiece:
  // sets reads sets and rest_seconds, timed reads target_duration_seconds,
  // distance reads target_distance_meters.
  RoutineExerciseTracking tracking = 4 [(buf.validate.field).enum.defined_only = true];
  // How many sets are prescribed; 0 is a routine that does not say, which is
  // every routine saved before one could.
  int32 sets = 5 [(buf.validate.field).int32 = {gte: 0, lte: 20}];
  // Metres prescribed for this occurrence, which ends when they are covered
  // rather than when a clock runs out.
  int32 target_distance_meters = 6 [(buf.validate.field).int32 = {gte: 0, lte: 50000}];
}

message CreatePlanRequest {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  repeated string routine_ids = 2 [(buf.validate.field).repeated = {min_items: 1, max_items: 100, unique: true, items: {string: {uuid: true}}}];
}
message CreatePlanResponse {
  Plan plan = 1;
}

message GetPlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetPlanResponse {
  Plan plan = 1;
}

message ListPlansRequest {}
message ListPlansResponse {
  repeated Plan plans = 1;
}

message UpdatePlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  repeated string routine_ids = 3 [(buf.validate.field).repeated = {min_items: 1, max_items: 100, unique: true, items: {string: {uuid: true}}}];
}
message UpdatePlanResponse {
  Plan plan = 1;
}

message DeletePlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeletePlanResponse {}

message SetActivePlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message SetActivePlanResponse {
  Plan plan = 1;
}

message PauseActivePlanRequest {}
message PauseActivePlanResponse {}

message SkipPlanRoutineRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message SkipPlanRoutineResponse {
  Plan plan = 1;
}

message Plan {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100
  }];
  repeated Routine routines = 3 [(buf.validate.field).repeated.min_items = 1];
  int32 current_position = 4 [(buf.validate.field).int32.gte = 0];
  bool active = 5;
}
