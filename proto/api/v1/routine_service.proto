syntax = "proto3";

package api.v1;

import "api/v1/options.proto";
import "api/v1/shared.proto";
import "api/v1/workout_service.proto";

import "buf/validate/validate.proto";

service RoutineService {
  rpc CreateRoutine(CreateRoutineRequest) returns (CreateRoutineResponse) {
    option (auth) = true;
  }
  rpc GetRoutine (GetRoutineRequest) returns (GetRoutineResponse) {
    option (auth) = true;
  }
  rpc UpdateRoutine (UpdateRoutineRequest) returns (UpdateRoutineResponse) {
    option (auth) = true;
  }
  rpc DeleteRoutine (DeleteRoutineRequest) returns (DeleteRoutineResponse) {
    option (auth) = true;
  }
  rpc ListRoutines (ListRoutinesRequest) returns (ListRoutinesResponse) {
    option (auth) = true;
  }
  rpc AddExercise (AddExerciseRequest) returns (AddExerciseResponse) {
    option (auth) = true;
  }
  rpc UpdateExerciseOrder (UpdateExerciseOrderRequest) returns (UpdateExerciseOrderResponse) {
    option (auth) = true;
  }
  rpc GetDashboard (GetDashboardRequest) returns (GetDashboardResponse) {
    option (auth) = true;
  }
  rpc CreatePlan (CreatePlanRequest) returns (CreatePlanResponse) {
    option (auth) = true;
  }
  rpc GetPlan (GetPlanRequest) returns (GetPlanResponse) {
    option (auth) = true;
  }
  rpc ListPlans (ListPlansRequest) returns (ListPlansResponse) {
    option (auth) = true;
  }
  rpc UpdatePlan (UpdatePlanRequest) returns (UpdatePlanResponse) {
    option (auth) = true;
  }
  rpc DeletePlan (DeletePlanRequest) returns (DeletePlanResponse) {
    option (auth) = true;
  }
  rpc SetActivePlan (SetActivePlanRequest) returns (SetActivePlanResponse) {
    option (auth) = true;
  }
  rpc PauseActivePlan (PauseActivePlanRequest) returns (PauseActivePlanResponse) {
    option (auth) = true;
  }
  rpc SkipPlanRoutine (SkipPlanRoutineRequest) returns (SkipPlanRoutineResponse) {
    option (auth) = true;
  }
}

message CreateRoutineRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated string exercise_ids = 2 [(buf.validate.field).repeated.min_items = 1];
  // Optional. When set, it describes how exercise_ids are grouped; when empty,
  // the routine gets a single straight-sets group holding every exercise.
  repeated RoutineGroup groups = 3;
}
message CreateRoutineResponse {
  string id = 1;
}

message GetRoutineRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetRoutineResponse {
  Routine routine = 1;
}

message UpdateRoutineRequest {
  Routine routine = 1 [(buf.validate.field).required = true];
}
message UpdateRoutineResponse {
  Routine routine = 1;
}

message DeleteRoutineRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeleteRoutineResponse {}

message ListRoutinesRequest {
  string name = 1;
  PaginationRequest pagination = 2 [(buf.validate.field).required = true];
}
message ListRoutinesResponse {
  repeated Routine routines = 1;
  PaginationResponse pagination = 2;
}

message AddExerciseRequest {
  string routine_id = 1 [(buf.validate.field).string.uuid = true];
  string exercise_id = 2 [(buf.validate.field).string.uuid = true];
}
message AddExerciseResponse {}

message UpdateExerciseOrderRequest {
  string routine_id = 1 [(buf.validate.field).string.uuid = true];
  repeated string exercise_ids = 2 [(buf.validate.field).repeated.min_items = 1];
}
message UpdateExerciseOrderResponse {}

message GetDashboardRequest {
  string preferred_routine_id = 1;
}

message GetDashboardResponse {
  Routine next_routine = 1;
  repeated Routine routines = 2;
  int32 workouts_this_week = 3;
  double volume_this_week = 4;
  repeated ExerciseSet personal_bests = 5;
  repeated Workout recent_workouts = 6;
  Plan active_plan = 7;
}

message Routine {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  // Every exercise of the routine, in the order they are trained. Groups
  // partition this same list; a client that does not care how the routine is
  // grouped can keep reading only this field.
  repeated Exercise exercises = 3 [(buf.validate.field).repeated.min_items = 1];
  repeated RoutineGroup groups = 4;
}

// How a group's exercises are worked through. Straight sets finish one exercise
// before the next begins; a circuit takes one set of each in turn and repeats
// until the session says it is done.
enum RoutineGroupMode {
  ROUTINE_GROUP_MODE_UNSPECIFIED = 0;
  ROUTINE_GROUP_MODE_STRAIGHT = 1;
  ROUTINE_GROUP_MODE_CIRCUIT = 2;
}

message RoutineGroup {
  // Server-assigned. Requests may leave it empty: a save replaces a routine's
  // groups wholesale rather than matching them up by ID.
  string id = 1;
  RoutineGroupMode mode = 2;
  // 3 held a round count. A circuit runs for as many rounds as the session
  // takes, and is ended from the session rather than planned in the routine.
  reserved 3;
  // Rest taken on the way from one exercise to the next inside a round.
  int32 rest_between_exercises_seconds = 4 [(buf.validate.field).int32 = {gte: 0, lte: 3600}];
  // Rest taken once a round closes, before the group starts again.
  int32 rest_between_rounds_seconds = 5 [(buf.validate.field).int32 = {gte: 0, lte: 3600}];
  repeated Exercise exercises = 6;
}

message CreatePlanRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  repeated string routine_ids = 2 [(buf.validate.field).repeated = {min_items: 1, unique: true, items: {string: {uuid: true}}}];
}
message CreatePlanResponse {
  Plan plan = 1;
}

message GetPlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message GetPlanResponse {
  Plan plan = 1;
}

message ListPlansRequest {}
message ListPlansResponse {
  repeated Plan plans = 1;
}

message UpdatePlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  repeated string routine_ids = 3 [(buf.validate.field).repeated = {min_items: 1, unique: true, items: {string: {uuid: true}}}];
}
message UpdatePlanResponse {
  Plan plan = 1;
}

message DeletePlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message DeletePlanResponse {}

message SetActivePlanRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message SetActivePlanResponse {
  Plan plan = 1;
}

message PauseActivePlanRequest {}
message PauseActivePlanResponse {}

message SkipPlanRoutineRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message SkipPlanRoutineResponse {
  Plan plan = 1;
}

message Plan {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  repeated Routine routines = 3 [(buf.validate.field).repeated.min_items = 1];
  int32 current_position = 4 [(buf.validate.field).int32.gte = 0];
  bool active = 5;
}
