version: "2"
linters:
  default: all
  disable:
    - funcorder
    - noinlineerr
    - wsl_v5
    - depguard
    - exhaustruct
    - funlen
    - godox
    - ireturn
    - lll
    - nlreturn
    - perfsprint
    - varnamelen
    - wsl
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
