version: "2"
linters:
  default: all
  disable:
    - funcorder
    - noinlineerr
    - wsl_v5
    - depguard
    - exhaustruct
    - funlen
    - godox
    - ireturn
    - lll
    - nlreturn
    - perfsprint
    - varnamelen
    - wsl
    - gomodguard
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
    rules:
      # Internal-package tests intentionally exercise unexported helpers. Requiring
      # external test packages or parallel subtests would make those tests less clear.
      - path: _test\.go
        linters:
          - goconst
          - gosec
          - paralleltest
          - testpackage
          - tparallel
      # Seed data is made of representative literal weights and repetition counts.
      - path: server/testing/factory/seed/main\.go
        linters:
          - mnd
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
