version: "2"
linters:
  default: all
  disable:
    - funcorder
    - noinlineerr
    - wsl_v5
    - exhaustruct
    - funlen
    - godox
    - ireturn
    - lll
    - nlreturn
    - perfsprint
    - varnamelen
    - wsl
    - gomodguard
  settings:
    depguard:
      rules:
        # One UUID package. The row types bobgen generates are gofrs UUIDs, so
        # a second one only ever arrives as a value that has to be converted
        # back before the store will take it.
        uuid:
          deny:
            - pkg: github.com/google/uuid
              desc: use github.com/gofrs/uuid/v5, which is what the generated models and the database driver speak
        # The bounded contexts own the business rules and nothing else. A rule
        # that needs a query, a request, an event or a log line has been put in
        # the wrong package: see server/CLAUDE.md. `internal/` would not catch
        # this — it constrains who may import you, not what you may import.
        domain:
          files:
            - "**/server/training/**"
            - "**/server/account/**"
            - "**/server/notification/**"
          deny:
            - pkg: database/sql
              desc: the domain does not read or write rows; let the store run the query and pass the result in
            - pkg: github.com/stephenafamo/bob
              desc: the domain does not build queries; the ORM is the store's business
            - pkg: github.com/crlssn/getstronger/server/gen/models$
              desc: the domain speaks in its own entities; the store reads rows into them
            - pkg: connectrpc.com/connect
              desc: the domain does not answer requests; map its errors to a code in the handler
            - pkg: net/http
              desc: the domain does not know it is reached over HTTP
            - pkg: go.uber.org/zap
              desc: the domain returns errors and lets the terminal layer log them once
            - pkg: go.uber.org/fx
              desc: the domain is constructed by its callers, not wired by a container
            - pkg: github.com/crlssn/getstronger/server/repo
              desc: the store depends on the domain, not the other way round
            - pkg: github.com/crlssn/getstronger/server/rpc
              desc: the RPC edge depends on the domain, not the other way round
            - pkg: github.com/crlssn/getstronger/server/pubsub
              desc: the domain does not publish or subscribe; raise the event from the use case that decided it
            - pkg: github.com/crlssn/getstronger/server/gen/proto
              desc: the domain speaks its own vocabulary; rpc/parser is where it meets the wire
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
      # The web app is linted by eslint. Once its dependencies are installed,
      # some of them vendor Go sources that this linter would otherwise report.
      - web/
    rules:
      # Internal-package tests intentionally exercise unexported helpers. Requiring
      # external test packages or parallel subtests would make those tests less clear.
      - path: _test\.go
        linters:
          - goconst
          - gosec
          - paralleltest
          - testpackage
          - tparallel
      # Seed data is made of representative literal weights and repetition counts.
      - path: server/testing/factory/seed/main\.go
        linters:
          - mnd
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      - ^web/
