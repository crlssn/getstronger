<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1917" />
    <meta name="description" content="Lift it. Log it. Beat it." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GetStronger" />
    <meta property="og:title" content="GetStronger" />
    <meta property="og:description" content="Lift it. Log it. Beat it." />
    <meta property="og:url" content="https://www.getstronger.studio/" />
    <meta property="og:image" content="https://www.getstronger.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The GetStronger logo next to the slogan: Lift it. Log it. Beat it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GetStronger" />
    <meta name="twitter:description" content="Lift it. Log it. Beat it." />
    <meta name="twitter:image" content="https://www.getstronger.studio/og-image.png" />
    <title>GetStronger</title>
    <script>
      // Before the first paint, so neither the splash nor the page flashes
      // light at a reader whose palette is dark. Mirrors stores/locale.ts,
      // which owns the attribute once the app is up.
      ;(() => {
        let theme
        try {
          theme = JSON.parse(localStorage.getItem('locale') ?? '{}').state?.theme
        } catch {
          // Not ours to interpret; the device decides below.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <style>
      /* Boot splash: painted before any JavaScript runs and swept away when
         the app mounts into #root. Cold starts wait on a token refresh
         against a serverless backend, and this keeps that wait from being a
         blank page. Colours mirror theme.css, which is not loaded yet. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        /* Bounded, not auto: an auto column takes the lockup's own 320px even
           on a narrower phone, and the max-width below would then measure
           itself against that rather than against the screen. */
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
        background: #f2f1ed;
        /* Held back a beat: a start that beats the splash shows the app
           rather than a flash of this. */
        opacity: 0;
        animation: boot-reveal 0.35s ease 0.4s forwards;
      }
      @keyframes boot-reveal {
        to {
          opacity: 1;
        }
      }

      /* The lockup is one drawing on a 320-unit grid: the wordmark rides
         between the collars and the slogan sits under the shaft, and neither
         lands anywhere else. --boot-px is that unit as a share of whatever
         width the phone leaves, so a narrow screen shrinks the whole thing
         rather than sliding the words off the bar. */
      #boot-splash .boot-lockup {
        --boot-px: 0.3125cqw;
        position: relative;
        width: 20rem;
        max-width: 100%;
        container-type: inline-size;
        color: #1a1917;
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
      }
      #boot-splash .boot-lockup svg {
        display: block;
        width: 100%;
        height: auto;
      }
      #boot-splash .boot-wordmark {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(3 * var(--boot-px));
        text-align: center;
        font-size: calc(30 * var(--boot-px));
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.045em;
      }
      /* Get semibold, Stronger bold — the same split the guest header makes. */
      #boot-splash .boot-wordmark span {
        font-weight: 600;
      }
      #boot-splash .boot-slogan {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(47 * var(--boot-px));
        display: grid;
        justify-items: center;
        font-size: calc(13 * var(--boot-px));
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      /* All three words in the one cell, so the line never reads as two. */
      #boot-splash .boot-slogan span {
        grid-area: 1 / 1;
        opacity: 0;
        animation: 6.4s ease-out infinite both;
      }
      #boot-splash .boot-slogan .w1 {
        animation-name: word-1;
      }
      #boot-splash .boot-slogan .w2 {
        animation-name: word-2;
      }
      #boot-splash .boot-slogan .w3 {
        animation-name: word-3;
      }

      /* Chrome for the bar, rubber for the plates. theme.css has no gradients
         and has not loaded anyway, so the splash mixes its own: a stack of
         stops read top edge to bottom, which the dark palette re-values
         rather than redraws. */
      #boot-splash {
        --boot-steel-crown: #6e6b65;
        --boot-steel-sheen: #ffffff;
        --boot-steel-face: #c4c1b9;
        --boot-steel-core: #4a4740;
        --boot-steel-belly: #7d7a73;
        --boot-steel-foot: #2c2a26;
        --boot-rubber-crown: #3a3835;
        --boot-rubber-sheen: #5a5852;
        --boot-rubber-face: #34322e;
        --boot-rubber-core: #22211e;
        --boot-rubber-belly: #2c2a27;
        --boot-rubber-foot: #171614;
        --boot-plate-side-lit: #2a2825;
        --boot-plate-side-deep: #121110;
      }
      #boot-splash .boot-steel {
        fill: url(#boot-steel);
      }
      #boot-splash .boot-rubber {
        fill: url(#boot-rubber);
      }
      #boot-splash .boot-plate-side-l {
        fill: url(#boot-plate-side-l);
      }
      #boot-splash .boot-plate-side-r {
        fill: url(#boot-plate-side-r);
      }
      /* The moulded edge every piece carries, drawn over its own fill. One
         value for both palettes: a cast shadow is dark on light paper and on
         dark. */
      #boot-splash .boot-edge {
        stroke: #000;
        stroke-opacity: 0.35;
        stroke-width: 0.6;
      }

      /* Loading, literally: plates slide onto the bar in pairs, each landing
         with a dip of the bar. Hold under full load, strip, load again. The
         wait has no known length, so reps, not progress. */
      #boot-splash .boot-rig {
        animation: bar-dip 6.4s linear infinite;
      }
      #boot-splash .boot-plate-l,
      #boot-splash .boot-plate-r {
        animation: 6.4s infinite both;
      }
      #boot-splash .boot-plate-l.p1 {
        animation-name: load-l1;
      }
      #boot-splash .boot-plate-l.p2 {
        animation-name: load-l2;
      }
      #boot-splash .boot-plate-l.p3 {
        animation-name: load-l3;
      }
      #boot-splash .boot-plate-r.p1 {
        animation-name: load-r1;
      }
      #boot-splash .boot-plate-r.p2 {
        animation-name: load-r2;
      }
      #boot-splash .boot-plate-r.p3 {
        animation-name: load-r3;
      }
      /* Load big to small, strip small to big, so plates never pass through
         one another. Each lands fast with a firm stop and a 2px shove into the
         collar before settling. */
      @keyframes load-l1 {
        0%,
        6% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        16% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        18%,
        82% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        88%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-l2 {
        0%,
        25% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        35% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        37%,
        76% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        82%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-l3 {
        0%,
        44% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        54% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        56%,
        70% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        76%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-r1 {
        0%,
        6% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        16% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        18%,
        82% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        88%,
        100% {
          transform: translateX(95px);
        }
      }
      @keyframes load-r2 {
        0%,
        25% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        35% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        37%,
        76% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        82%,
        100% {
          transform: translateX(95px);
        }
      }
      @keyframes load-r3 {
        0%,
        44% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        54% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        56%,
        70% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        76%,
        100% {
          transform: translateX(95px);
        }
      }
      /* The bar gives under each pair as it lands, and only then. */
      @keyframes bar-dip {
        0%,
        15.9% {
          transform: translateY(0);
        }
        16% {
          transform: translateY(1.2px);
        }
        18.5%,
        34.9% {
          transform: translateY(0);
        }
        35% {
          transform: translateY(1.3px);
        }
        37.5%,
        53.9% {
          transform: translateY(0);
        }
        54% {
          transform: translateY(1.5px);
        }
        56.5%,
        100% {
          transform: translateY(0);
        }
      }
      /* A word rises as its pair lands and is gone before the next arrives.
         None of them come back on the way down; the bar strips in silence. */
      @keyframes word-1 {
        0%,
        15.9% {
          opacity: 0;
          transform: translateY(0.35em);
        }
        19%,
        34.9% {
          opacity: 1;
          transform: translateY(0);
        }
        37%,
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }
      @keyframes word-2 {
        0%,
        34.9% {
          opacity: 0;
          transform: translateY(0.35em);
        }
        38%,
        53.9% {
          opacity: 1;
          transform: translateY(0);
        }
        56%,
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }
      @keyframes word-3 {
        0%,
        53.9% {
          opacity: 0;
          transform: translateY(0.35em);
        }
        57%,
        74% {
          opacity: 1;
          transform: translateY(0);
        }
        82%,
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }

      /* The splash in the dark palette, mirroring theme.css the same way the
         light colours above do. The script above has set data-theme before
         any of this paints. */
      [data-theme='dark'] #boot-splash {
        background: #161512;
      }
      [data-theme='dark'] #boot-splash .boot-lockup {
        color: #ece9e2;
      }
      /* Light letterforms on dark paper carry more weight than they do the
         other way round, so both drop a step to read the same. */
      [data-theme='dark'] #boot-splash .boot-wordmark {
        font-weight: 600;
      }
      [data-theme='dark'] #boot-splash .boot-wordmark span {
        font-weight: 500;
      }
      [data-theme='dark'] #boot-splash .boot-slogan {
        font-weight: 800;
      }
      /* Chrome brightens and the rubber turns pale: the bar is lit from the
         same side, by a room that is now dark. */
      [data-theme='dark'] #boot-splash {
        --boot-steel-crown: #8d8a84;
        --boot-steel-sheen: #ffffff;
        --boot-steel-face: #d4d1ca;
        --boot-steel-core: #5a574f;
        --boot-steel-belly: #8a8780;
        --boot-steel-foot: #3a3731;
        --boot-rubber-crown: #cfccc4;
        --boot-rubber-sheen: #ffffff;
        --boot-rubber-face: #e3e1da;
        --boot-rubber-core: #bdbab2;
        --boot-rubber-belly: #cbc8c0;
        --boot-rubber-foot: #9c998f;
        --boot-plate-side-lit: #b6b3ab;
        --boot-plate-side-deep: #8f8b83;
      }

      /* With the motion gone, the bar parks fully loaded on the last word. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          animation-duration: 0.01ms;
          animation-delay: 0.4s;
        }
        #boot-splash .boot-rig,
        #boot-splash .boot-plate-l,
        #boot-splash .boot-plate-r,
        #boot-splash .boot-slogan span {
          animation: none;
        }
        #boot-splash .boot-slogan .w3 {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body id="app">
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-lockup">
        <svg viewBox="0 10 320 76">
          <defs>
            <linearGradient id="boot-steel" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--boot-steel-crown)" />
              <stop offset="0.18" stop-color="var(--boot-steel-sheen)" />
              <stop offset="0.42" stop-color="var(--boot-steel-face)" />
              <stop offset="0.62" stop-color="var(--boot-steel-core)" />
              <stop offset="0.85" stop-color="var(--boot-steel-belly)" />
              <stop offset="1" stop-color="var(--boot-steel-foot)" />
            </linearGradient>
            <linearGradient id="boot-rubber" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="var(--boot-rubber-crown)" />
              <stop offset="0.18" stop-color="var(--boot-rubber-sheen)" />
              <stop offset="0.42" stop-color="var(--boot-rubber-face)" />
              <stop offset="0.62" stop-color="var(--boot-rubber-core)" />
              <stop offset="0.85" stop-color="var(--boot-rubber-belly)" />
              <stop offset="1" stop-color="var(--boot-rubber-foot)" />
            </linearGradient>
            <!-- The outer face of a plate, turned just far enough to catch the
                 light. It falls away towards the bar, so the two ends mirror. -->
            <linearGradient id="boot-plate-side-r" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="var(--boot-plate-side-lit)" stop-opacity="0" />
              <stop offset="1" stop-color="var(--boot-plate-side-deep)" />
            </linearGradient>
            <linearGradient id="boot-plate-side-l" x1="1" y1="0" x2="0" y2="0">
              <stop offset="0" stop-color="var(--boot-plate-side-lit)" stop-opacity="0" />
              <stop offset="1" stop-color="var(--boot-plate-side-deep)" />
            </linearGradient>
          </defs>
          <g class="boot-rig">
            <!-- shaft, then the sleeves and collars the plates seat against -->
            <rect class="boot-steel" x="60" y="46" width="200" height="4" rx="2" />
            <rect class="boot-steel boot-edge" x="5" y="44.5" width="57" height="7" rx="3.5" />
            <rect class="boot-steel boot-edge" x="258" y="44.5" width="57" height="7" rx="3.5" />
            <rect class="boot-steel boot-edge" x="55" y="39" width="7" height="18" rx="2" />
            <rect class="boot-steel boot-edge" x="258" y="39" width="7" height="18" rx="2" />
            <!-- plates, drawn where they seat and stacked flush; they slide in
                 from off the bar -->
            <g class="boot-plate-l p1">
              <rect class="boot-rubber" x="40" y="16" width="16" height="64" rx="5" />
              <rect
                class="boot-edge"
                fill="none"
                x="40.3"
                y="16.3"
                width="15.4"
                height="63.4"
                rx="4.7"
              />
              <rect class="boot-plate-side-l" x="40" y="20" width="5" height="56" rx="2" />
            </g>
            <g class="boot-plate-l p2">
              <rect class="boot-rubber" x="25" y="16" width="16" height="64" rx="5" />
              <rect
                class="boot-edge"
                fill="none"
                x="25.3"
                y="16.3"
                width="15.4"
                height="63.4"
                rx="4.7"
              />
              <rect class="boot-plate-side-l" x="25" y="20" width="5" height="56" rx="2" />
            </g>
            <g class="boot-plate-l p3">
              <rect class="boot-rubber" x="10" y="16" width="16" height="64" rx="5" />
              <rect
                class="boot-edge"
                fill="none"
                x="10.3"
                y="16.3"
                width="15.4"
                height="63.4"
                rx="4.7"
              />
              <rect class="boot-plate-side-l" x="10" y="20" width="5" height="56" rx="2" />
            </g>
            <g class="boot-plate-r p1">
              <rect class="boot-rubber" x="264" y="16" width="16" height="64" rx="5" />
              <rect
                class="boot-edge"
                fill="none"
                x="264.3"
                y="16.3"
                width="15.4"
                height="63.4"
                rx="4.7"
              />
              <rect class="boot-plate-side-r" x="275" y="20" width="5" height="56" rx="2" />
            </g>
            <g class="boot-plate-r p2">
              <rect class="boot-rubber" x="279" y="16" width="16" height="64" rx="5" />
              <rect
                class="boot-edge"
                fill="none"
                x="279.3"
                y="16.3"
                width="15.4"
                height="63.4"
                rx="4.7"
              />
              <rect class="boot-plate-side-r" x="290" y="20" width="5" height="56" rx="2" />
            </g>
            <g class="boot-plate-r p3">
              <rect class="boot-rubber" x="294" y="16" width="16" height="64" rx="5" />
              <rect
                class="boot-edge"
                fill="none"
                x="294.3"
                y="16.3"
                width="15.4"
                height="63.4"
                rx="4.7"
              />
              <rect class="boot-plate-side-r" x="305" y="20" width="5" height="56" rx="2" />
            </g>
          </g>
        </svg>
        <strong class="boot-wordmark"><span>Get</span>Stronger</strong>
        <div class="boot-slogan">
          <span class="w1">Lift it</span>
          <span class="w2">Log it</span>
          <span class="w3">Beat it</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
