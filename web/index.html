<!doctype html>

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#25282d" />
    <meta name="description" content="Lift it. Log it. Beat it." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GetStronger" />
    <meta property="og:title" content="GetStronger" />
    <meta property="og:description" content="Lift it. Log it. Beat it." />
    <meta property="og:url" content="https://www.getstronger.studio/" />
    <meta property="og:image" content="https://www.getstronger.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

      property="og:image:alt"
      content="The GetStronger logo next to the slogan: Lift it. Log it. Beat it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GetStronger" />
    <meta name="twitter:description" content="Lift it. Log it. Beat it." />
    <meta name="twitter:image" content="https://www.getstronger.studio/og-image.png" />
    <title>GetStronger</title>
    <style>
      /* Boot splash: painted before any JavaScript runs and swept away when
         the app mounts into #root. Cold starts wait on a token refresh
         against a serverless backend, and this keeps that wait from being a
         blank page. Colours mirror theme.css, which is not loaded yet. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 1.75rem;
        background: #f5f5f3;
      }
      #boot-splash .boot-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #16181b;
        font-family: system-ui, sans-serif;
      }
      #boot-splash .boot-mark {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.75rem;
        background: #25282d;
        box-shadow: 0 1px 2px #d4d5d3;
      }
      #boot-splash .boot-mark img {
        width: 1.75rem;
        height: 1.75rem;
        filter: brightness(0) invert(1);
      }
      #boot-splash .boot-copy {
        display: flex;
        flex-direction: column;
      }
      #boot-splash .boot-copy strong {
        font-size: 1.125rem;
        line-height: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      /* Get semibold, Stronger bold — the same split the guest header makes. */
      #boot-splash .boot-copy strong span {
        font-weight: 600;
      }
      #boot-splash .boot-copy > span {
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 700;
        color: #656b71;
      }
      #boot-splash .boot-progress {
        position: relative;
        overflow: hidden;
        width: 8rem;
        height: 0.1875rem;
        border-radius: 999px;
        background: rgba(37, 40, 45, 0.12);
      }
      #boot-splash .boot-progress span {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        border-radius: inherit;
        background: #25282d;
        animation: boot-splash-swing 1.1s ease-in-out infinite alternate;
      }
      /* Swings between the ends of the track rather than looping in one
         direction: the wait has no known length, so nothing should read as
         progress towards a finish. */
      @keyframes boot-splash-swing {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(150%);
        }
      }
      /* A full-width bar would read as finished, so with the motion gone the
         indicator simply parks mid-track. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-progress span {
          left: 30%;
          animation: none;
        }
      }
    </style>
  </head>
  <body id="app">
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-brand">
        <span class="boot-mark"><img src="/favicon.png" alt="" /></span>
        <span class="boot-copy">
          <strong><span>Get</span>Stronger</strong>
          <span>Lift it. Log it. Beat it.</span>
        </span>
      </div>
      <div class="boot-progress"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
