    <style>
      /* Boot splash: painted before any JavaScript runs and swept away when
         the app mounts into #root. Cold starts wait on a token refresh
         against a serverless backend, and this keeps that wait from being a
         blank page. Colours mirror theme.css, which is not loaded yet. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2rem;
        background: #f5f4f2;
      }
      #boot-splash .boot-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #17171a;
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
      }
      #boot-splash .boot-mark {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.75rem;
        background: #17171a;
        box-shadow:
          0 1px 2px #d3d0c9,
          0 8px 20px -14px #d3d0c9;
      }
      #boot-splash .boot-mark img {
        width: 1.75rem;
        height: 1.75rem;
        filter: brightness(0) invert(1);
      }
      #boot-splash .boot-copy {
        display: flex;
        flex-direction: column;
      }
      #boot-splash .boot-copy strong {
        font-size: 1.125rem;
        line-height: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      /* Get semibold, Stronger bold — the same split the guest header makes. */
      #boot-splash .boot-copy strong span {
        font-weight: 600;
      }
      #boot-splash .boot-copy > span {
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 700;
        color: #6e6b65;
      }
      /* Six frames of a power clean, run behind a window one frame wide. The
         wait has no known length, so the loop reads as work rather than as
         progress towards a finish. */
      #boot-splash .boot-lifter {
        overflow: hidden;
        width: 7.5rem;
        height: 7.5rem;
      }
      #boot-splash .boot-lifter svg {
        display: block;
        width: 45rem;
        height: 7.5rem;
        animation: boot-splash-clean 1.2s steps(6) infinite;
      }
      /* The lifter is a stroked skeleton: a pose is a set of joints, and the
         weight of each stroke is what makes a torso a torso and an arm an arm. */
      #boot-splash .boot-lifter path {
        fill: none;
        stroke: #17171a;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #boot-splash .boot-legs {
        stroke-width: 4.5;
      }
      #boot-splash .boot-torso {
        stroke-width: 6.5;
      }
      #boot-splash .boot-arm {
        stroke-width: 3;
      }
      #boot-splash .boot-thin {
        stroke-width: 2.5;
      }
      /* Paper, laid behind the arm and the plate: in profile both cross the
         body, and without it the three read as one shape. */
      #boot-splash .boot-arm-behind {
        stroke: #f5f4f2;
        stroke-width: 5.5;
      }
      #boot-splash .boot-plate-behind {
        fill: #f5f4f2;
      }
      #boot-splash .boot-head,
      #boot-splash .boot-plate {
        fill: #17171a;
      }
      /* The sleeve, seen down the bar: the one hole in the plate. */
      #boot-splash .boot-hub {
        fill: #f5f4f2;
      }
      #boot-splash .boot-ground {
        fill: #d3d0c9;
      }
      @keyframes boot-splash-clean {
        to {
          transform: translateX(-45rem);
        }
      }
      /* With the motion gone, the lift parks on the frame it finishes in. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-lifter svg {
          transform: translateX(-30rem);
          animation: none;
        }
      }
    </style>
