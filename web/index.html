<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1917" />
    <meta name="description" content="Lift it. Log it. Beat it." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GetStronger" />
    <meta property="og:title" content="GetStronger" />
    <meta property="og:description" content="Lift it. Log it. Beat it." />
    <meta property="og:url" content="https://www.getstronger.studio/" />
    <meta property="og:image" content="https://www.getstronger.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The GetStronger logo next to the slogan: Lift it. Log it. Beat it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GetStronger" />
    <meta name="twitter:description" content="Lift it. Log it. Beat it." />
    <meta name="twitter:image" content="https://www.getstronger.studio/og-image.png" />
    <title>GetStronger</title>
    <script>
      // Before the first paint, so neither the splash nor the page flashes
      // light at a reader whose palette is dark. Mirrors stores/locale.ts,
      // which owns the attribute once the app is up.
      ;(() => {
        let theme
        try {
          theme = JSON.parse(localStorage.getItem('locale') ?? '{}').state?.theme
        } catch {
          // Not ours to interpret; the device decides below.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <style>
      /* Boot splash: painted before any JavaScript runs and swept away when
         the app mounts into #root. Cold starts wait on a token refresh
         against a serverless backend, and this keeps that wait from being a
         blank page. Colours mirror theme.css, which is not loaded yet. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2.25rem;
        padding: 2rem;
        box-sizing: border-box;
        background: #f2f1ed;
        /* Held back a beat: a start that beats the splash shows the app
           rather than a flash of this. */
        opacity: 0;
        animation: boot-reveal 0.35s ease 0.4s forwards;
      }
      @keyframes boot-reveal {
        to {
          opacity: 1;
        }
      }
      #boot-splash .boot-brand {
        display: grid;
        justify-items: center;
        gap: 0.875rem;
        text-align: center;
        color: #1a1917;
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
      }
      #boot-splash .boot-mark {
        display: grid;
        place-items: center;
        width: 3rem;
        height: 3rem;
        border-radius: 0.875rem;
        background: #1a1917;
        box-shadow:
          0 1px 2px #dedcd4,
          0 8px 20px -14px #dedcd4;
      }
      #boot-splash .boot-mark img {
        width: 1.875rem;
        height: 1.875rem;
        filter: brightness(0) invert(1);
      }
      #boot-splash .boot-copy {
        display: grid;
        gap: 0.375rem;
      }
      #boot-splash .boot-copy strong {
        font-size: 1.375rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      /* Get semibold, Stronger bold — the same split the guest header makes. */
      #boot-splash .boot-copy strong span {
        font-weight: 600;
      }
      #boot-splash .boot-copy > span {
        font-size: 0.75rem;
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: #6e6b65;
      }

      /* Loading, literally: plates slide onto the bar in pairs, each landing
         with a dip of the bar. Hold under full load, strip, load again. The
         wait has no known length, so reps, not progress. */
      #boot-splash .boot-barbell {
        width: 17.5rem;
        max-width: 100%;
      }
      #boot-splash .boot-barbell svg {
        display: block;
        width: 100%;
        height: auto;
      }
      #boot-splash .boot-steel {
        fill: #1a1917;
      }
      #boot-splash .boot-ground {
        fill: #dedcd4;
      }
      /* Three weights of plate, so a loaded bar reads as loaded rather than as
         one black slab. Each is a step of the ink ramp. */
      #boot-splash .p1 {
        fill: #1a1917;
      }
      #boot-splash .p2 {
        fill: #6b675c;
      }
      #boot-splash .p3 {
        fill: #6e6b65;
      }
      #boot-splash .boot-rig {
        animation: bar-dip 6.4s linear infinite;
      }
      #boot-splash .boot-plate-l,
      #boot-splash .boot-plate-r {
        animation: 6.4s infinite both;
      }
      #boot-splash .boot-plate-l.p1 {
        animation-name: load-l1;
      }
      #boot-splash .boot-plate-l.p2 {
        animation-name: load-l2;
      }
      #boot-splash .boot-plate-l.p3 {
        animation-name: load-l3;
      }
      #boot-splash .boot-plate-r.p1 {
        animation-name: load-r1;
      }
      #boot-splash .boot-plate-r.p2 {
        animation-name: load-r2;
      }
      #boot-splash .boot-plate-r.p3 {
        animation-name: load-r3;
      }
      /* Load big to small, strip small to big, so plates never pass through
         one another. Each lands fast with a firm stop and a 2px shove into the
         collar before settling. */
      @keyframes load-l1 {
        0%,
        6% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        16% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        18%,
        82% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        88%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-l2 {
        0%,
        25% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        35% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        37%,
        76% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        82%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-l3 {
        0%,
        44% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        54% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        56%,
        70% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        76%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-r1 {
        0%,
        6% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        16% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        18%,
        82% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        88%,
        100% {
          transform: translateX(95px);
        }
      }
      @keyframes load-r2 {
        0%,
        25% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        35% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        37%,
        76% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        82%,
        100% {
          transform: translateX(95px);
        }
      }
      @keyframes load-r3 {
        0%,
        44% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        54% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        56%,
        70% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        76%,
        100% {
          transform: translateX(95px);
        }
      }
      /* The bar gives under each pair as it lands, and only then. */
      @keyframes bar-dip {
        0%,
        15.9% {
          transform: translateY(0);
        }
        16% {
          transform: translateY(1.2px);
        }
        18.5%,
        34.9% {
          transform: translateY(0);
        }
        35% {
          transform: translateY(1.3px);
        }
        37.5%,
        53.9% {
          transform: translateY(0);
        }
        54% {
          transform: translateY(1.5px);
        }
        56.5%,
        100% {
          transform: translateY(0);
        }
      }

      /* The splash in the dark palette, mirroring theme.css the same way the
         light colours above do. The script above has set data-theme before
         any of this paints. */
      [data-theme='dark'] #boot-splash {
        background: #161512;
      }
      [data-theme='dark'] #boot-splash .boot-brand {
        color: #ece9e2;
      }
      [data-theme='dark'] #boot-splash .boot-mark {
        background: #e8e6e0;
        box-shadow:
          0 1px 2px #3b382f,
          0 8px 20px -14px #3b382f;
      }
      [data-theme='dark'] #boot-splash .boot-mark img {
        filter: brightness(0);
      }
      [data-theme='dark'] #boot-splash .boot-copy > span {
        color: #a8a397;
      }
      [data-theme='dark'] #boot-splash .boot-steel,
      [data-theme='dark'] #boot-splash .p1 {
        fill: #e8e6e0;
      }
      [data-theme='dark'] #boot-splash .p2 {
        fill: #a29d90;
      }
      [data-theme='dark'] #boot-splash .p3 {
        fill: #a8a397;
      }
      [data-theme='dark'] #boot-splash .boot-ground {
        fill: #3b382f;
      }

      /* With the motion gone, the bar parks fully loaded. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          animation-duration: 0.01ms;
          animation-delay: 0.4s;
        }
        #boot-splash .boot-rig,
        #boot-splash .boot-plate-l,
        #boot-splash .boot-plate-r {
          animation: none;
        }
      }
    </style>
  </head>
  <body id="app">
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-brand">
        <span class="boot-mark"><img src="/favicon.png" alt="" /></span>
        <span class="boot-copy">
          <strong><span>Get</span>Stronger</strong>
          <span>Lift it. Log it. Beat it.</span>
        </span>
      </div>
      <div class="boot-barbell">
        <svg viewBox="0 0 240 96">
          <g class="boot-rig">
            <!-- shaft, sleeves and collars -->
            <rect class="boot-steel" x="70" y="45.5" width="100" height="5" rx="2.5" />
            <rect class="boot-steel" x="34" y="44" width="38" height="8" rx="4" />
            <rect class="boot-steel" x="168" y="44" width="38" height="8" rx="4" />
            <rect class="boot-steel" x="66" y="38" width="6" height="20" rx="3" />
            <rect class="boot-steel" x="168" y="38" width="6" height="20" rx="3" />
            <!-- plates, drawn where they seat; they slide in from off the bar -->
            <rect class="boot-plate-l p1" x="57" y="22" width="9" height="52" rx="4" />
            <rect class="boot-plate-l p2" x="48" y="27" width="9" height="42" rx="4" />
            <rect class="boot-plate-l p3" x="39" y="32" width="9" height="32" rx="4" />
            <rect class="boot-plate-r p1" x="174" y="22" width="9" height="52" rx="4" />
            <rect class="boot-plate-r p2" x="183" y="27" width="9" height="42" rx="4" />
            <rect class="boot-plate-r p3" x="192" y="32" width="9" height="32" rx="4" />
          </g>
          <rect class="boot-ground" x="30" y="80" width="180" height="2" rx="1" />
        </svg>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
