<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1917" />
    <meta name="description" content="Lift it. Log it. Beat it." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="GetStronger" />
    <meta property="og:title" content="GetStronger" />
    <meta property="og:description" content="Lift it. Log it. Beat it." />
    <meta property="og:url" content="https://www.getstronger.studio/" />
    <meta property="og:image" content="https://www.getstronger.studio/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The GetStronger logo next to the slogan: Lift it. Log it. Beat it."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GetStronger" />
    <meta name="twitter:description" content="Lift it. Log it. Beat it." />
    <meta name="twitter:image" content="https://www.getstronger.studio/og-image.png" />
    <title>GetStronger</title>
    <script>
      // Before the first paint, so neither the splash nor the page flashes
      // light at a reader whose palette is dark. Mirrors stores/locale.ts,
      // which owns the attribute once the app is up.
      ;(() => {
        let theme
        try {
          theme = JSON.parse(localStorage.getItem('locale') ?? '{}').state?.theme
        } catch {
          // Not ours to interpret; the device decides below.
        }
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
    <style>
      /* Boot splash: painted before any JavaScript runs and swept away when
         the app mounts into #root. Cold starts wait on a token refresh
         against a serverless backend, and this keeps that wait from being a
         blank page. Colours mirror theme.css, which is not loaded yet. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        /* Bounded, not auto: an auto column takes the lockup's own 320px even
           on a narrower phone, and the max-width below would then measure
           itself against that rather than against the screen. */
        grid-template-columns: minmax(0, 1fr);
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
        /* The three values the rig is drawn in, mirroring theme.css, which has
           not loaded yet. Named as the tokens they are so the SVG below reads
           the same as the rest of the app does. */
        background: #f2f1ed;
        --color-ink: #1a1917;
        --color-ink-muted: #6b675c;
        /* Held back a beat: a start that beats the splash shows the app
           rather than a flash of this. */
        opacity: 0;
        animation: boot-reveal 0.35s ease 0.4s forwards;
      }
      @keyframes boot-reveal {
        to {
          opacity: 1;
        }
      }

      /* The lockup is one drawing on a 320-unit grid: the wordmark rides
         between the collars and the slogan sits under the shaft, and neither
         lands anywhere else. --boot-px is that unit as a share of whatever
         width the phone leaves, so a narrow screen shrinks the whole thing
         rather than sliding the words off the bar. */
      #boot-splash .boot-lockup {
        --boot-px: 0.3125cqw;
        position: relative;
        width: 20rem;
        max-width: 100%;
        container-type: inline-size;
        color: #1a1917;
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
      }
      #boot-splash .boot-lockup svg {
        display: block;
        width: 100%;
        height: auto;
      }
      #boot-splash .boot-wordmark {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(3 * var(--boot-px));
        text-align: center;
        font-size: calc(30 * var(--boot-px));
        line-height: 1;
        font-weight: 700;
        letter-spacing: -0.045em;
      }
      /* Get semibold, Stronger bold — the same split the guest header makes. */
      #boot-splash .boot-wordmark span {
        font-weight: 600;
      }
      #boot-splash .boot-slogan {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(47 * var(--boot-px));
        display: grid;
        justify-items: center;
        font-size: calc(13 * var(--boot-px));
        font-weight: 900;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #666257;
      }
      /* All three words in the one cell, so the line never reads as two. */
      #boot-splash .boot-slogan span {
        grid-area: 1 / 1;
        opacity: 0;
        animation: 6.4s ease-out infinite both;
      }
      #boot-splash .boot-slogan .w1 {
        animation-name: word-1;
      }
      #boot-splash .boot-slogan .w2 {
        animation-name: word-2;
      }
      #boot-splash .boot-slogan .w3 {
        animation-name: word-3;
      }

      /* Loading, literally: plates slide onto the bar in pairs, each landing
         with a dip of the bar. Hold under full load, strip, load again. The
         wait has no known length, so reps, not progress. */
      #boot-splash .boot-rig {
        animation: bar-dip 6.4s linear infinite;
      }
      #boot-splash .boot-plate-l,
      #boot-splash .boot-plate-r {
        animation: 6.4s infinite both;
      }
      #boot-splash .boot-plate-l.p1 {
        animation-name: load-l1;
      }
      #boot-splash .boot-plate-l.p2 {
        animation-name: load-l2;
      }
      #boot-splash .boot-plate-l.p3 {
        animation-name: load-l3;
      }
      #boot-splash .boot-plate-r.p1 {
        animation-name: load-r1;
      }
      #boot-splash .boot-plate-r.p2 {
        animation-name: load-r2;
      }
      #boot-splash .boot-plate-r.p3 {
        animation-name: load-r3;
      }
      /* Load big to small, strip small to big, so plates never pass through
         one another. Each lands fast with a firm stop and a 2px shove into the
         collar before settling. */
      @keyframes load-l1 {
        0%,
        6% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        16% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        18%,
        82% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        88%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-l2 {
        0%,
        25% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        35% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        37%,
        76% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        82%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-l3 {
        0%,
        44% {
          transform: translateX(-95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        54% {
          transform: translateX(2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        56%,
        70% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        76%,
        100% {
          transform: translateX(-95px);
        }
      }
      @keyframes load-r1 {
        0%,
        6% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        16% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        18%,
        82% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        88%,
        100% {
          transform: translateX(95px);
        }
      }
      @keyframes load-r2 {
        0%,
        25% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        35% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        37%,
        76% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        82%,
        100% {
          transform: translateX(95px);
        }
      }
      @keyframes load-r3 {
        0%,
        44% {
          transform: translateX(95px);
          animation-timing-function: cubic-bezier(0.4, 0, 0.1, 1);
        }
        54% {
          transform: translateX(-2px);
          animation-timing-function: cubic-bezier(0.3, 0, 0.6, 1);
        }
        56%,
        70% {
          transform: translateX(0);
          animation-timing-function: cubic-bezier(0.7, 0, 0.9, 0.6);
        }
        76%,
        100% {
          transform: translateX(95px);
        }
      }
      /* The bar gives under each pair as it lands, and only then. */
      @keyframes bar-dip {
        0%,
        15.9% {
          transform: translateY(0);
        }
        16% {
          transform: translateY(1.2px);
        }
        18.5%,
        34.9% {
          transform: translateY(0);
        }
        35% {
          transform: translateY(1.3px);
        }
        37.5%,
        53.9% {
          transform: translateY(0);
        }
        54% {
          transform: translateY(1.5px);
        }
        56.5%,
        100% {
          transform: translateY(0);
        }
      }
      /* A word rises as its pair lands and is gone before the next arrives.
         None of them come back on the way down; the bar strips in silence. */
      @keyframes word-1 {
        0%,
        15.9% {
          opacity: 0;
          transform: translateY(0.35em);
        }
        19%,
        34.9% {
          opacity: 1;
          transform: translateY(0);
        }
        37%,
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }
      @keyframes word-2 {
        0%,
        34.9% {
          opacity: 0;
          transform: translateY(0.35em);
        }
        38%,
        53.9% {
          opacity: 1;
          transform: translateY(0);
        }
        56%,
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }
      @keyframes word-3 {
        0%,
        53.9% {
          opacity: 0;
          transform: translateY(0.35em);
        }
        57%,
        74% {
          opacity: 1;
          transform: translateY(0);
        }
        82%,
        100% {
          opacity: 0;
          transform: translateY(0);
        }
      }

      /* The splash in the dark palette, mirroring theme.css the same way the
         light colours above do. The script above has set data-theme before
         any of this paints. */
      [data-theme='dark'] #boot-splash {
        background: #161512;
        --color-ink: #e8e6e0;
        --color-ink-muted: #a29d90;
      }
      [data-theme='dark'] #boot-splash .boot-lockup {
        color: #ece9e2;
      }
      /* Light letterforms on dark paper carry more weight than they do the
         other way round, so both drop a step to read the same. */
      [data-theme='dark'] #boot-splash .boot-wordmark {
        font-weight: 600;
      }
      [data-theme='dark'] #boot-splash .boot-wordmark span {
        font-weight: 500;
      }
      [data-theme='dark'] #boot-splash .boot-slogan {
        font-weight: 800;
        color: #b3aea2;
      }

      /* With the motion gone, the bar parks fully loaded on the last word. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash {
          animation-duration: 0.01ms;
          animation-delay: 0.4s;
        }
        #boot-splash .boot-rig,
        #boot-splash .boot-plate-l,
        #boot-splash .boot-plate-r,
        #boot-splash .boot-slogan span {
          animation: none;
        }
        #boot-splash .boot-slogan .w3 {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body id="app">
    <div id="boot-splash" aria-hidden="true">
      <div class="boot-lockup">
        <!-- Clipped, deliberately: the plates park 95 units outside the box
             and slide in from off the bar. -->
        <svg viewBox="0 10 320 76">
          <g class="boot-rig">
            <!-- shaft, then the sleeves and collars the plates seat against -->
            <rect
              x="60"
              y="46.75"
              width="200"
              height="2.5"
              rx="1.25"
              fill="var(--color-ink-muted)"
            />
            <rect x="5" y="45" width="57" height="6" rx="3" fill="var(--color-ink-muted)" />
            <rect x="258" y="45" width="57" height="6" rx="3" fill="var(--color-ink-muted)" />
            <rect x="55" y="39" width="7" height="18" rx="2.5" fill="var(--color-ink)" />
            <rect x="258" y="39" width="7" height="18" rx="2.5" fill="var(--color-ink)" />
            <!-- plates, drawn where they seat: one solid shape each, half a
                 unit apart so the canvas separates the stack -->
            <g class="boot-plate-l p1">
              <rect x="40.5" y="16" width="14.5" height="64" rx="4.5" fill="var(--color-ink)" />
            </g>
            <g class="boot-plate-l p2">
              <rect x="25.5" y="16" width="14.5" height="64" rx="4.5" fill="var(--color-ink)" />
            </g>
            <g class="boot-plate-l p3">
              <rect x="10.5" y="16" width="14.5" height="64" rx="4.5" fill="var(--color-ink)" />
            </g>
            <g class="boot-plate-r p1">
              <rect x="265" y="16" width="14.5" height="64" rx="4.5" fill="var(--color-ink)" />
            </g>
            <g class="boot-plate-r p2">
              <rect x="280" y="16" width="14.5" height="64" rx="4.5" fill="var(--color-ink)" />
            </g>
            <g class="boot-plate-r p3">
              <rect x="295" y="16" width="14.5" height="64" rx="4.5" fill="var(--color-ink)" />
            </g>
          </g>
        </svg>
        <strong class="boot-wordmark"><span>Get</span>Stronger</strong>
        <div class="boot-slogan">
          <span class="w1">Lift it</span>
          <span class="w2">Log it</span>
          <span class="w3">Beat it</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
