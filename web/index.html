    <style>
      /* Boot splash: painted before any JavaScript runs and swept away when
         the app mounts into #root. Cold starts wait on a token refresh
         against a serverless backend, and this keeps that wait from being a
         blank page. Colours mirror theme.css, which is not loaded yet. */
      #boot-splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 2rem;
        background: #f5f4f2;
      }
      #boot-splash .boot-brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        color: #17171a;
        font-family: 'Plus Jakarta Sans Variable', system-ui, sans-serif;
      }
      #boot-splash .boot-mark {
        display: grid;
        place-items: center;
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 0.75rem;
        background: #17171a;
        box-shadow:
          0 1px 2px #d3d0c9,
          0 8px 20px -14px #d3d0c9;
      }
      #boot-splash .boot-mark img {
        width: 1.75rem;
        height: 1.75rem;
        filter: brightness(0) invert(1);
      }
      #boot-splash .boot-copy {
        display: flex;
        flex-direction: column;
      }
      #boot-splash .boot-copy strong {
        font-size: 1.125rem;
        line-height: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.025em;
      }
      /* Get semibold, Stronger bold — the same split the guest header makes. */
      #boot-splash .boot-copy strong span {
        font-weight: 600;
      }
      #boot-splash .boot-copy > span {
        font-size: 0.875rem;
        line-height: 1.25rem;
        font-weight: 700;
        color: #6e6b65;
      }
      /* Six frames of a power clean, run behind a window one frame wide. The
         wait has no known length, so the loop reads as work rather than as
         progress towards a finish. */
      #boot-splash .boot-stage {
        display: grid;
        place-items: center;
        padding: 1.25rem;
        border: 1px solid #edebe7;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow:
          0 1px 2px rgb(23 23 26 / 0.05),
          0 8px 20px -14px rgb(23 23 26 / 0.18);
      }
      #boot-splash .boot-lifter {
        overflow: hidden;
        width: 7.5rem;
        height: 7.5rem;
        color: #17171a;
      }
      #boot-splash .boot-lifter svg {
        display: block;
        width: 45rem;
        height: 7.5rem;
        fill: currentColor;
        animation: boot-splash-clean 1.2s steps(6) infinite;
      }
      /* Pixels stay square; the floor under them is the one thing that curves. */
      #boot-splash .boot-frame {
        shape-rendering: crispEdges;
      }
      #boot-splash .boot-ground {
        fill: #e4e2dd;
      }
      @keyframes boot-splash-clean {
        to {
          transform: translateX(-45rem);
        }
      }
      /* With the motion gone, the lift parks on the frame it finishes in. */
      @media (prefers-reduced-motion: reduce) {
        #boot-splash .boot-lifter svg {
          transform: translateX(-30rem);
          animation: none;
        }
      }
    </style>
