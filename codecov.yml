# Paths are matched from the repository root and a '*' does not cross a '/',
# so patterns for files that live in any package need the '**/' prefix. Without
# it the generated mocks counted as thousands of uncovered lines.
ignore:
  - "**/*_mock.go"
  - "**/*_test.go"
  - "server/gen"
  # Test infrastructure (factories, testcontainer setup, the e2e saga) exists
  # only to support tests; its lines are not product code to be covered.
  - "server/testing"
  - "web/src/proto"
