// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Lock the plugin classpath (AGP, google-services) in buildscript-gradle.lockfile.
    dependencyLocking {
        lockAllConfigurations()
    }

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Pin dependency versions in app/gradle.lockfile so builds are reproducible
// and version bumps show up in review. Only :app is locked: the Capacitor
// projects live under node_modules, so their lockfiles could not be tracked.
// Refresh with: ./gradlew :app:dependencies --write-locks
project(':app') {
    dependencyLocking {
        lockAllConfigurations()
    }
}
