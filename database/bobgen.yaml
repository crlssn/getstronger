psql:
  dsn: "postgres://root:root@localhost:5433/postgres?sslmode=disable"
  except:
    schema_migrations:

# IDs cross the API boundary as strings, so retain the existing model contract.
replacements:
  - match:
      db_type: uuid
    replace: string

no_tests: true

plugins:
  models:
    destination: server/gen/models
  enums:
    destination: server/gen/models/enums
  dberrors:
    destination: server/gen/models/dberrors
  factory:
    destination: server/gen/factory
  dbinfo:
    disabled: true
