psql:
  # The DSN is deliberately not set here. It comes from the PSQL_DSN environment
  # variable, which the db:migrate and db:reset tasks build from .env so that
  # bobgen always reads the database the migrations were applied to. Hardcoding
  # it makes worktrees, which run their own container on their own port,
  # regenerate against the main checkout's database instead.
  except:
    schema_migrations:

types:
  int32:
    random_expr: "return f.Int32Between(0, 3600)"

plugins:
  models:
    destination: server/gen/models
  enums:
    destination: server/gen/models/enums
  dberrors:
    destination: server/gen/models/dberrors
  factory:
    destination: server/gen/factory
  dbinfo:
    destination: server/gen/dbinfo
