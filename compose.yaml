name: getstronger

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: getstronger-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - '${SERVER_PORT:-8080}'
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1:$${SERVER_PORT}/healthz']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.11.4-alpine
    container_name: getstronger-caddy
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: '${API_DOMAIN:?API_DOMAIN is required}'
      SERVER_PORT: '${SERVER_PORT:-8080}'
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
