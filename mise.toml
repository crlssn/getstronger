min_version = "2026.8.2"

[tools]
buf = "1.50.0"
go = "1.26.6"
gofumpt = "0.10.0"
golangci-lint = "2.12.2"
node = "24.19.0"
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = {
    version = "v4.19.1",
    tags = "postgres",
    depends = ["go"]
}
"go:github.com/stephenafamo/bob/gen/bobgen-psql" = {
    version = "v0.50.0",
    depends = ["go"]
}
"go:go.uber.org/mock/mockgen" = {
    version = "v0.6.0",
    depends = ["go"]
}
"go:golang.org/x/tools/cmd/goimports" = {
    version = "v0.48.0",
    depends = ["go"]
}

[env]
# mise APPENDS its tool directories to the end of PATH, so anything installed by
# Homebrew or 'go install' shadows the versions pinned in [tools] above and the
# tasks silently run the wrong tool. Observed on a developer machine: Node 26
# instead of the pinned 22 for every web task, buf 1.72 instead of 1.50, and a
# bobgen-psql v0.49 that rewrites every generated model under server/gen/.
#
# Putting the shims directory first resolves each tool to its pinned version.
# It also fixes the tools a task invokes indirectly, which naming a binary
# cannot: npm finds its matching node through PATH, not through its own path.
# A shims directory that does not exist is simply ignored.
PATH = "{{ env.MISE_DATA_DIR | default(value=env.HOME ~ '/.local/share/mise') }}/shims:{{ env.PATH }}"

# Worktrees override the container names and ports below in mise.local.toml so
# that parallel checkouts never share state. See 'mise run worktree:env'.
DB_SSL_MODE = { default = "disable" }
DB_IMAGE = { default = "postgres:16.4" }
DB_CONTAINER = { default = "getstronger" }
MAILHOG_CONTAINER = { default = "getstronger-mailhog" }
MAILHOG_SMTP_PORT = { default = "1025" }
MAILHOG_HTTP_PORT = { default = "8025" }
WEB_DEV_PORT = { default = "5173" }
E2E_WEB_PORT = { default = "15173" }
E2E_SERVER_PORT = { default = "18180" }
E2E_SSE_PORT = { default = "18181" }
DB_CONFIG_PATH = { default = "./database/bobgen.yaml" }
DB_MIGRATIONS_PATH = { default = "database/migrations/" }
USER_EMAIL = { default = "active@getstronger.test" }
USER_PASSWORD = { default = "password123" }
USER_FIRSTNAME = { default = "Alex" }
USER_LASTNAME = { default = "Morgan" }
NEW_USER_EMAIL = { default = "new@getstronger.test" }
NEW_USER_FIRSTNAME = { default = "Sam" }
NEW_USER_LASTNAME = { default = "Taylor" }

# Database tasks

[tasks."db:init"]
alias = "db_init"
description = "Recreate the local PostgreSQL container"
env = { _.file = ".env" }
run = [{ task = "db:clean" }, '''
  docker run --name "$DB_CONTAINER" -d -p "$DB_PORT:5432" \
    -e POSTGRES_DB="$DB_NAME" \
    -e POSTGRES_USER="$DB_USER" \
    -e POSTGRES_HOST_AUTH_METHOD=trust \
    "$DB_IMAGE"
  ''']

[tasks."db:start"]
alias = "db_start"
description = "Start the local PostgreSQL container"
run = 'docker start "$DB_CONTAINER"'

[tasks."db:reset"]
alias = "db_migrate"
description = "Reset migrations and regenerate the database models"
env = { _.file = ".env" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Resolved through mise rather than PATH: mise appends its tool directories to
# the END of PATH, so a 'go install'-ed migrate or bobgen-psql in ~/go/bin (or a
# Homebrew one) shadows the versions pinned above. A mismatched bobgen silently
# rewrites every file under server/gen/ in its own format. Same reasoning as
# 'lint:backend'.
migrate="$(mise which migrate)"
bobgen="$(mise which bobgen-psql)"

# bobgen must read the schema from the same database the migrations were just
# applied to. Worktrees get their own container and port in .env, so the DSN is
# built here and handed to bobgen through PSQL_DSN rather than being hardcoded
# in database/bobgen.yaml. See 'mise run worktree:env'.
dsn="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"

"$migrate" -path "$DB_MIGRATIONS_PATH" -database "$dsn" -verbose down --all
"$migrate" -path "$DB_MIGRATIONS_PATH" -database "$dsn" -verbose up
PSQL_DSN="$dsn" "$bobgen" -c "$DB_CONFIG_PATH"
git apply --ignore-space-change database/bobgen-v0.50.0.patch
'''

[tasks."db:migrate"]
alias = ["db_migrate_up", "db:migrate:up"]
description = "Apply pending migrations and regenerate the database models"
env = { _.file = ".env" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

# See the notes in 'db:reset' on why the binaries are resolved through mise and
# why the DSN is built here.
migrate="$(mise which migrate)"
bobgen="$(mise which bobgen-psql)"
dsn="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"

"$migrate" -path "$DB_MIGRATIONS_PATH" -database "$dsn" -verbose up
PSQL_DSN="$dsn" "$bobgen" -c "$DB_CONFIG_PATH"
git apply --ignore-space-change database/bobgen-v0.50.0.patch
'''

[tasks."db:seed"]
alias = "db_seed"
description = "Seed the local database"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# See the note in 'db:reset' on why the binary is resolved through mise.
"$(mise which go)" run server/testing/factory/seed/main.go \
  -email="$USER_EMAIL" \
  -password="$USER_PASSWORD" \
  -firstname="$USER_FIRSTNAME" \
  -lastname="$USER_LASTNAME" \
  -new-email="$NEW_USER_EMAIL" \
  -new-firstname="$NEW_USER_FIRSTNAME" \
  -new-lastname="$NEW_USER_LASTNAME"
'''

# Code generation tasks

[tasks.gen]
description = "Generate all code and local certificates"
run = [{ task = "gen:go" }, { task = "gen:certs" }, { task = "gen:protos" }]

[tasks."gen:go"]
alias = "gen_go"
description = "Run Go code generation"
run = "go generate ./..."

[tasks."gen:certs"]
alias = "gen_certs"
description = "Generate self-signed certificates for local HTTPS"
env = { _.file = ".env" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

mkdir -p .secrets
openssl req -x509 -out .secrets/localhost.crt -keyout .secrets/localhost.key \
  -newkey rsa:2048 -nodes -sha256 \
  -subj "/CN=localhost" -extensions EXT -config <(
    printf "[dn]\nCN=localhost\n[req]\ndistinguished_name = dn\n[EXT]\nsubjectAltName=DNS:localhost\nkeyUsage=digitalSignature\nextendedKeyUsage=serverAuth"
  )

echo "✅  Appending cert and key paths to .env file"
grep -q '^SERVER_KEY_PATH=' .env || echo "SERVER_KEY_PATH=$PWD/.secrets/localhost.key" >> .env
grep -q '^SERVER_CERT_PATH=' .env || echo "SERVER_CERT_PATH=$PWD/.secrets/localhost.crt" >> .env
echo "⚠️ Restart the server and visit the following link to trust the certificate in your browser: https://localhost:$SERVER_PORT"
'''

[tasks."gen:protos"]
alias = "gen_protos"
description = "Generate and format Protocol Buffer code"
run = ["buf generate", { task = "format:backend" }]

# Test tasks

[tasks.test]
description = "Run all tests"
run = [{ task = "test:web" }, { task = "test:backend" }]

[tasks."test:web"]
alias = "test_web"
description = "Build and test the web application"
dir = "web"
run = [
    "npm run build",
    "npm run test:unit -- --run",
]

[tasks."test:backend"]
alias = "test_backend"
description = "Run backend tests"
run = "go test ./..."

[tasks."test:e2e"]
alias = "test_e2e"
description = "Reset seeded data and run browser end-to-end tests"
run = [
    { task = "db:seed" },
    "cd web && npm run test:e2e",
    'echo "Open the report with: mise run test:e2e:report"',
]

[tasks."test:e2e:headed"]
description = "Reset seeded data and run visible browser end-to-end tests"
run = [{ task = "db:seed" }, "cd web && npm run test:e2e:headed"]

[tasks."test:e2e:live"]
description = "Run the non-mutating browser smoke suite against E2E_BASE_URL"
dir = "web"
run = [
    'test -n "$E2E_BASE_URL" || (echo "E2E_BASE_URL is required" && exit 1)',
    "npm run test:e2e:live",
]

[tasks."test:e2e:report"]
description = "Open the latest browser end-to-end test report"
run = "cd web && npm run test:e2e:report"

[tasks."test:e2e:ui"]
description = "Reset seeded data and open the Playwright test UI"
run = [{ task = "db:seed" }, "cd web && npm run test:e2e:ui"]

# Application tasks

[tasks.app]
description = "Run the web, email, and backend applications"
run = [{ tasks = ["app:web", "app:email", "app:backend"] }]

[tasks."app:web"]
alias = "app_web"
description = "Run the web development server"
dir = "web"
run = ["npm install", "npm run dev"]

[tasks."app:email"]
alias = "app_email"
description = "Run MailHog"
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Docker fixes a container's port bindings when it is created, so 'docker start'
# can never repair one that was created with the wrong ports. Recreate it
# instead, or the task reports an address nothing is listening on.
published() {
  docker port "$MAILHOG_CONTAINER" "$1/tcp" 2>/dev/null | head -1 | sed 's/.*://'
}

if docker container inspect "$MAILHOG_CONTAINER" >/dev/null 2>&1; then
  docker start "$MAILHOG_CONTAINER" >/dev/null
  if [[ "$(published 1025)" != "$MAILHOG_SMTP_PORT" || "$(published 8025)" != "$MAILHOG_HTTP_PORT" ]]; then
    echo "⚠️ Container '$MAILHOG_CONTAINER' does not publish $MAILHOG_SMTP_PORT and $MAILHOG_HTTP_PORT. Recreating it."
    docker rm -f "$MAILHOG_CONTAINER" >/dev/null
  fi
fi

if ! docker container inspect "$MAILHOG_CONTAINER" >/dev/null 2>&1; then
  docker run -d --name "$MAILHOG_CONTAINER" \
    -p "$MAILHOG_SMTP_PORT:1025" \
    -p "$MAILHOG_HTTP_PORT:8025" \
    mailhog/mailhog >/dev/null
fi

echo "The email app is running at http://localhost:$MAILHOG_HTTP_PORT"
'''

[tasks."app:backend"]
alias = "app_backend"
description = "Run the backend server"
run = "go run ./server/cmd/main.go"

# Code quality tasks

[tasks.format]
description = "Format all code"
run = [
    { task = "format:web" },
    { task = "format:backend" },
]

[tasks."format:web"]
alias = "format_web"
description = "Format web code"
dir = "web"
run = ["npx sort-package-json", "npm run format"]

[tasks."format:backend"]
alias = "format_backend"
description = "Format backend code"
run = ["goimports -w .", "gofumpt -l -w ."]

[tasks.lint]
description = "Lint all code"
run = [
    { task = "lint:web" },
    { task = "lint:protos" },
    { task = "lint:backend" },
]

[tasks."lint:web"]
alias = "lint_web"
description = "Lint web code"
dir = "web"
run = "npm run lint"

[tasks."lint:protos"]
alias = "lint_protos"
description = "Lint Protocol Buffer definitions"
run = "buf lint"

[tasks."lint:backend"]
alias = "lint_backend"
description = "Lint backend code"
# Resolved through mise rather than PATH: a system golangci-lint v1 shadows the
# version pinned above on some machines, and v1 refuses this v2 configuration.
run = '"$(mise which golangci-lint)" run'

[tasks.vet]
description = "Vet all code"
run = [{ task = "vet:go" }]

[tasks."vet:go"]
alias = "vet_go"
description = "Vet Go code"
run = "go vet ./..."

# Installation tasks

[tasks.install]
description = "Install dependencies, tools, and Git hooks"
run = [
    { task = "install:tools" },
    { task = "install:go" },
    { task = "install:js" },
    { task = "install:hooks" },
]

[tasks."install:go"]
alias = "install_go"
description = "Install Go dependencies"
run = ["go mod download", "go mod tidy"]

[tasks."install:js"]
alias = "install_js"
description = "Install JavaScript dependencies"
run = ["npm install", { task = "install:js:web" }]

[tasks."install:js:web"]
alias = "install_js_web"
description = "Install web dependencies"
hide = true
dir = "web"
run = "npm install"

[tasks."install:e2e"]
description = "Install the browsers used by end-to-end tests"
dir = "web"
run = "npx playwright install chromium firefox webkit"

[tasks."install:tools"]
alias = "install_tools"
description = "Install the tools configured in mise.toml"
run = "mise install"

[tasks."install:hooks"]
alias = "install_hooks"
description = "Install the pre-push Git hook"
run = [
    # Resolve the hook directory via Git so this also works from a worktree,
    # where .git is a file rather than a directory.
    '''
    hooks="$(git rev-parse --git-path hooks)"
    mkdir -p "$hooks"
    cp ./scripts/pre_push_hook.sh "$hooks/pre-push"
    chmod +x "$hooks/pre-push"
    ''',
    '''echo "✅  Installed pre-push hook"''',
]

# Local development tasks

[tasks.env]
description = "Create local environment files when missing"
run = [
    "test -f .env || cp .env.example .env",
    "test -f web/.env || cp web/.env.example web/.env",
    { task = "worktree:env" },
]

[tasks."worktree:env"]
description = "Give this worktree its own ports, database, and containers"
run = "./scripts/worktree_env.sh"

[tasks.setup]
description = "Set up and run the local development environment"
run = [
    { task = "install" },
    { task = "env" },
    { task = "gen:certs" },
    { task = "db:init" },
    "sleep 1",
    { task = "db:migrate" },
    { task = "db:seed" },
    { task = "app" },
]

# Cleanup tasks

[tasks.clean]
description = "Remove local development resources"
run = [{ task = "db:clean" }, { task = "email:clean" }]

[tasks."email:clean"]
description = "Remove the local MailHog container"
run = 'docker rm -f "$MAILHOG_CONTAINER" || true'

[tasks."db:clean"]
alias = "clean_db"
description = "Remove the local PostgreSQL container"
run = 'docker rm -f "$DB_CONTAINER" || true'
