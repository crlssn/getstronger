min_version = "2026.8.2"

[tools]
# The S3 client Scaleway recommends, and the one deploy.yml already uses
# against their endpoint. It is here because 'scw object' manages buckets but
# cannot put objects, which is what 'pr:screenshots' needs.
aws-cli = "2.36.31"
buf = "1.50.0"
bun = "1.4.0"
go = "1.27.1"
gofumpt = "0.10.0"
golangci-lint = "2.13.2"
node = "24.19.0"
# Records which test reached which line, for 'test:backend:coverage'. It
# instruments the build through -toolexec and reads the counters back itself,
# and the two halves must be the same version, so the version lives here rather
# than in whatever a 'go install' left in PATH.
"go:github.com/goccy/tobari/cmd/tobari" = {
    version = "v0.12.1",
    depends = ["go"]
}
"go:github.com/golang-migrate/migrate/v4/cmd/migrate" = {
    version = "v4.19.1",
    tags = "postgres",
    depends = ["go"]
}
"go:github.com/stephenafamo/bob/gen/bobgen-psql" = {
    version = "v0.50.0",
    depends = ["go"]
}
"go:go.uber.org/mock/mockgen" = {
    version = "v0.6.0",
    depends = ["go"]
}
"go:golang.org/x/tools/cmd/goimports" = {
    version = "v0.48.0",
    depends = ["go"]
}

[env]
# mise APPENDS its tool directories to the end of PATH, so anything installed by
# Homebrew or 'go install' shadows the versions pinned in [tools] above and the
# tasks silently run the wrong tool. Observed on a developer machine: Node 26
# instead of the pinned 22 for every web task, buf 1.72 instead of 1.50, and a
# bobgen-psql v0.49 that rewrites every generated model under server/gen/.
#
# Putting the shims directory first resolves each tool to its pinned version.
# It also fixes the tools a task invokes indirectly, which naming a binary
# cannot: npm finds its matching node through PATH, not through its own path.
# A shims directory that does not exist is simply ignored.
PATH = "{{ env.MISE_DATA_DIR | default(value=env.HOME ~ '/.local/share/mise') }}/shims:{{ env.PATH }}"

# golangci-lint caches results by file content and reports each one against the
# path it was computed at. Worktrees hold the same files, so one shared cache
# reports a sibling worktree's paths — and the generated-file exclusions, which
# have to reread those paths, stop applying, or fail outright once that worktree
# is gone. A cache per checkout keeps the results attached to the files that
# produced them.
GOLANGCI_LINT_CACHE = "{{ config_root }}/.golangci-lint-cache"

# Worktrees override the container names and ports below in mise.local.toml so
# that parallel checkouts never share state. See 'mise run worktree:env'.
DB_SSL_MODE = { default = "disable" }
DB_IMAGE = { default = "postgres:16.4" }
DB_CONTAINER = { default = "getstronger" }
MAILHOG_CONTAINER = { default = "getstronger-mailhog" }
MAILHOG_SMTP_PORT = { default = "1025" }
MAILHOG_HTTP_PORT = { default = "8025" }
WEB_DEV_PORT = { default = "5173" }
E2E_WEB_PORT = { default = "15173" }
E2E_SERVER_PORT = { default = "18180" }
E2E_SSE_PORT = { default = "18181" }
SCREENSHOT_WEB_PORT = { default = "15273" }
SCREENSHOT_SERVER_PORT = { default = "18280" }
SCREENSHOT_SSE_PORT = { default = "18281" }
# Playwright's report and UI servers take no port of their own, so every
# worktree would serve them on the same one. The slot block has room to spare.
PLAYWRIGHT_REPORT_PORT = { default = "9323" }
PLAYWRIGHT_UI_PORT = { default = "9324" }
DB_CONFIG_PATH = { default = "./database/bobgen.yaml" }
DB_MIGRATIONS_PATH = { default = "database/migrations/" }
USER_EMAIL = { default = "active@getstronger.test" }
USER_PASSWORD = { default = "password123" }
USER_NAME = { default = "Alex Morgan" }
NEW_USER_EMAIL = { default = "new@getstronger.test" }
NEW_USER_NAME = { default = "Sam Taylor" }

# The GitHub App that authors pull requests. Neither id is a credential, so
# they are tracked here and every worktree and clone gets them with no setup;
# a shell profile would reach only interactive shells, never an agent's or a
# hook's. The private key is the credential, and it stays out of the
# repository. See 'mise run pr:create'.
GH_APP_ID = { default = "4701373" }
GH_APP_INSTALLATION_ID = { default = "156182314" }
GH_APP_PRIVATE_KEY = { default = "{{ env.HOME }}/.config/getstronger/gh-app.pem" }

# Database tasks

[tasks."db:init"]
alias = "db_init"
description = "Recreate the local PostgreSQL container"
env = { _.file = ".env" }
run = [{ task = "worktree:guard" }, { task = "db:clean" }, '''
  docker run --name "$DB_CONTAINER" -d -p "$DB_PORT:5432" \
    -e POSTGRES_DB="$DB_NAME" \
    -e POSTGRES_USER="$DB_USER" \
    -e POSTGRES_HOST_AUTH_METHOD=trust \
    "$DB_IMAGE"
  ''']

[tasks."db:start"]
alias = "db_start"
description = "Start the local PostgreSQL container"
run = 'docker start "$DB_CONTAINER"'

[tasks."db:reset"]
alias = "db_migrate"
description = "Reset migrations and regenerate the database models"
env = { _.file = ".env" }
run = [{ task = "worktree:guard" }, '''
#!/usr/bin/env bash
set -euo pipefail

# Resolved through mise rather than PATH: mise appends its tool directories to
# the END of PATH, so a 'go install'-ed migrate or bobgen-psql in ~/go/bin (or a
# Homebrew one) shadows the versions pinned above. A mismatched bobgen silently
# rewrites every file under server/gen/ in its own format. Same reasoning as
# 'lint:backend'.
migrate="$(mise which migrate)"
bobgen="$(mise which bobgen-psql)"

# bobgen must read the schema from the same database the migrations were just
# applied to. Worktrees get their own container and port in .env, so the DSN is
# built here and handed to bobgen through PSQL_DSN rather than being hardcoded
# in database/bobgen.yaml. See 'mise run worktree:env'.
dsn="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"

"$migrate" -path "$DB_MIGRATIONS_PATH" -database "$dsn" -verbose down --all
"$migrate" -path "$DB_MIGRATIONS_PATH" -database "$dsn" -verbose up
PSQL_DSN="$dsn" "$bobgen" -c "$DB_CONFIG_PATH"
git apply --ignore-space-change database/bobgen-v0.50.0.patch
''']

[tasks."db:migrate"]
alias = ["db_migrate_up", "db:migrate:up"]
description = "Apply pending migrations and regenerate the database models"
env = { _.file = ".env" }
run = [{ task = "worktree:guard" }, '''
#!/usr/bin/env bash
set -euo pipefail

# See the notes in 'db:reset' on why the binaries are resolved through mise and
# why the DSN is built here.
migrate="$(mise which migrate)"
bobgen="$(mise which bobgen-psql)"
dsn="postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"

"$migrate" -path "$DB_MIGRATIONS_PATH" -database "$dsn" -verbose up
PSQL_DSN="$dsn" "$bobgen" -c "$DB_CONFIG_PATH"
git apply --ignore-space-change database/bobgen-v0.50.0.patch
''']

[tasks."db:seed"]
alias = "db_seed"
description = "Seed the local database"
run = [{ task = "worktree:guard" }, '''
#!/usr/bin/env bash
set -euo pipefail

# See the note in 'db:reset' on why the binary is resolved through mise.
"$(mise which go)" run server/testing/factory/seed/main.go \
  -email="$USER_EMAIL" \
  -password="$USER_PASSWORD" \
  -name="$USER_NAME" \
  -new-email="$NEW_USER_EMAIL" \
  -new-name="$NEW_USER_NAME"
''']

# Code generation tasks

[tasks.gen]
description = "Generate all code and local certificates"
run = [
    { task = "gen:go" },
    { task = "gen:certs" },
    { task = "gen:protos" },
    { task = "gen:exercises" },
]

[tasks."gen:exercises"]
alias = "gen_exercises"
description = "Compile exercises/*.yaml into the web app's exercise catalogue"
dir = "web"
run = "node scripts/generate-exercises.mjs"

[tasks."gen:go"]
alias = "gen_go"
description = "Run Go code generation"
run = "go generate ./..."

[tasks."gen:certs"]
alias = "gen_certs"
description = "Generate self-signed certificates for local HTTPS"
env = { _.file = ".env" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

mkdir -p .secrets
openssl req -x509 -out .secrets/localhost.crt -keyout .secrets/localhost.key \
  -newkey rsa:2048 -nodes -sha256 \
  -subj "/CN=localhost" -extensions EXT -config <(
    printf "[dn]\nCN=localhost\n[req]\ndistinguished_name = dn\n[EXT]\nsubjectAltName=DNS:localhost\nkeyUsage=digitalSignature\nextendedKeyUsage=serverAuth"
  )

echo "✅  Appending cert and key paths to .env file"
grep -q '^SERVER_KEY_PATH=' .env || echo "SERVER_KEY_PATH=$PWD/.secrets/localhost.key" >> .env
grep -q '^SERVER_CERT_PATH=' .env || echo "SERVER_CERT_PATH=$PWD/.secrets/localhost.crt" >> .env
echo "⚠️ Restart the server and visit the following link to trust the certificate in your browser: https://localhost:$SERVER_PORT"
'''

[tasks."gen:protos"]
alias = "gen_protos"
description = "Generate and format Protocol Buffer code"
run = ["buf generate", { task = "format:backend" }]

# Test tasks

[tasks.test]
description = "Run all tests"
run = [{ task = "test:web" }, { task = "test:backend" }]

[tasks."test:web"]
alias = "test_web"
description = "Build and test the web application"
dir = "web"
run = [
    "npm run build",
    "npm run test:unit -- --run",
]

[tasks."test:backend"]
alias = "test_backend"
description = "Run backend tests"
run = "go test ./..."

# The same coverage, attributed to the test that reached each line rather than
# to the run as a whole — one entry per test under 'counts'. The first run pays
# an instrumented build of every test binary; later ones are ordinary test time.
[tasks."test:backend:coverage"]
description = "Run the backend tests under coverage instrumentation, attributed per test"
usage = 'arg "<packages>" help="Packages to measure, defaulting to the whole backend" default="./server/..."'
env = { TOBARI_COVERDIR = "{{ config_root }}/.tobari" }
run = '''
#!/usr/bin/env bash
set -euo pipefail

# Resolved through mise for the same reason as 'db:reset': mise appends its
# tools to the END of PATH, so a 'go install'-ed tobari shadows the pinned one
# and instruments a build its own reader then rejects.
tobari="$(mise which tobari)"
reports="$TOBARI_COVERDIR/packages"

rm -rf "$TOBARI_COVERDIR"
mkdir -p "$reports"

# Every test binary writes the report to one path as it exits, and none of them
# merges, so packages running side by side would leave only the last one's.
# Each measures into a directory of its own and they are merged below.
#
# -coverpkg matches 'test.server.yml', so a helper exercised from another
# package's test counts where it lives; -count=1 because a cached test runs
# nothing and so reports nothing.
export GOFLAGS="$("$tobari" flags)"
go list "$usage_packages" | xargs -P "$(getconf _NPROCESSORS_ONLN)" -I {} \
    bash -c 'TOBARI_COVERDIR="$1/$(printf %s "$2" | tr / _)" go test -count=1 -coverpkg=./server/... "$2"' _ "$reports" {}

shopt -s nullglob
found=("$reports"/*/tobari/tobari.json)
# Counted this way rather than through the array's own length: mise renders a
# task through a template engine, and the dollar-brace-hash that length needs
# opens a comment there which nothing closes.
measured=$(printf '%s\n' "${found[@]}" | grep -c . || true)
case "$measured" in
    0) echo "No package under $usage_packages has tests." && exit 1 ;;
    1) cp "${found[0]}" "$TOBARI_COVERDIR/tobari.json" ;;
    *) "$tobari" merge json -o "$TOBARI_COVERDIR/tobari.json" "${found[@]}" ;;
esac

"$tobari" convert -o "$TOBARI_COVERDIR/coverage.out" "$TOBARI_COVERDIR/tobari.json"

tests=$(node -p "require('$TOBARI_COVERDIR/tobari.json').counts.length")
echo "$tests tests measured in $TOBARI_COVERDIR/tobari.json"
echo "Read them with: tobari html -o coverage.html $TOBARI_COVERDIR/tobari.json"
'''

# The suite seeds itself in its global setup, once per run rather than once per
# spec file, so no task reseeds ahead of it. The guard still runs: seeding
# truncates the database, and a worktree with no stack of its own would truncate
# the main checkout's.
[tasks."test:e2e"]
alias = "test_e2e"
description = "Run browser end-to-end tests"
run = [
    { task = "worktree:guard" },
    "cd web && npm run test:e2e",
    'echo "Open the report with: mise run test:e2e:report"',
]

[tasks."test:e2e:headed"]
description = "Run visible browser end-to-end tests"
run = [{ task = "worktree:guard" }, "cd web && npm run test:e2e:headed"]

[tasks."test:e2e:live"]
description = "Run the non-mutating browser smoke suite against E2E_BASE_URL"
dir = "web"
run = [
    'test -n "$E2E_BASE_URL" || (echo "E2E_BASE_URL is required" && exit 1)',
    "npm run test:e2e:live",
]

[tasks."test:e2e:report"]
description = "Open the latest browser end-to-end test report"
run = 'cd web && npm run test:e2e:report -- --port "$PLAYWRIGHT_REPORT_PORT"'

[tasks."test:e2e:ui"]
description = "Open the Playwright test UI"
run = [
    { task = "worktree:guard" },
    'cd web && npm run test:e2e:ui -- --ui-port "$PLAYWRIGHT_UI_PORT"',
]

# Screenshot tasks

# Every set lands in web/screenshots/<ref>/, named after the ref it was
# photographed on, so a run only ever removes its own. Two branches can hold a
# set at once, and 'screenshots:diff' compares one against the other.
[tasks.screenshots]
description = "Capture mobile screenshots of every page for the seeded personas"
# The snapshot is taken after the seed and before the flows mutate it, so a
# later 'screenshots:diff' can put the same data back and compare like with
# like. The clock the run renders relative times against is written with it.
env = { SCREENSHOT_SNAPSHOT = "capture" }
run = [
    { task = "db:seed" },
    "cd web && npm run screenshots",
    'echo "Open the contact sheet with: mise run screenshots:open"',
]

[tasks."screenshots:page"]
description = "Re-capture the pages whose name matches a pattern, keeping the rest of the set"
usage = 'arg "<pattern>" help="Matched against page names, for example routine or \"active home\""'
# No reseeding and no wipe, so a design change can be re-photographed in
# seconds without losing the pages this run does not touch.
env = { SCREENSHOT_KEEP = "1" }
run = 'cd web && npm run screenshots -- --grep "$usage_pattern"'

[tasks."screenshots:diff"]
description = "Re-capture and report which pages a change moved, compared with another ref's set"
usage = """
arg "<pattern>" help="Pages to re-capture, defaulting to all of them" default="."
flag "--against <ref>" help="Ref whose set is the before, defaulting to main"
"""
# The seed is never run again: it randomises names, so reseeding would move
# every page and drown out the change being looked at. The snapshot 'screenshots'
# took is put back instead, which is the same data under the same names — and
# without it the flows' own exercises, routines and workouts leak from one run
# into the next, and pages nobody touched report a difference.
env = { SCREENSHOT_DIFF = "1", SCREENSHOT_KEEP = "1", SCREENSHOT_SNAPSHOT = "restore" }
run = 'cd web && SCREENSHOT_AGAINST="${usage_against:-main}" npm run screenshots -- --grep "$usage_pattern"'

[tasks."screenshots:open"]
description = "Open this ref's mobile screenshot contact sheet"
run = 'open "web/screenshots/$(./scripts/screenshots_ref.sh)/index.html"'

[tasks."screenshots:prune"]
description = "List the screenshot sets left behind by branches that are gone, or remove them"
usage = 'flag "--force" help="Remove the sets instead of listing them"'
run = "./scripts/screenshots_prune.sh"

# Application tasks

[tasks.app]
description = "Run the web, email, and backend applications"
run = [{ tasks = ["app:web", "app:email", "app:backend"] }]

[tasks."app:web"]
alias = "app_web"
description = "Run the web development server"
dir = "web"
run = ["bun install", "npm run dev"]

[tasks."app:email"]
alias = "app_email"
description = "Run MailHog"
run = [{ task = "worktree:guard" }, '''
#!/usr/bin/env bash
set -euo pipefail

# Docker fixes a container's port bindings when it is created, so 'docker start'
# can never repair one that was created with the wrong ports. Recreate it
# instead, or the task reports an address nothing is listening on.
published() {
  docker port "$MAILHOG_CONTAINER" "$1/tcp" 2>/dev/null | head -1 | sed 's/.*://'
}

if docker container inspect "$MAILHOG_CONTAINER" >/dev/null 2>&1; then
  docker start "$MAILHOG_CONTAINER" >/dev/null
  if [[ "$(published 1025)" != "$MAILHOG_SMTP_PORT" || "$(published 8025)" != "$MAILHOG_HTTP_PORT" ]]; then
    echo "⚠️ Container '$MAILHOG_CONTAINER' does not publish $MAILHOG_SMTP_PORT and $MAILHOG_HTTP_PORT. Recreating it."
    docker rm -f "$MAILHOG_CONTAINER" >/dev/null
  fi
fi

if ! docker container inspect "$MAILHOG_CONTAINER" >/dev/null 2>&1; then
  docker run -d --name "$MAILHOG_CONTAINER" \
    -p "$MAILHOG_SMTP_PORT:1025" \
    -p "$MAILHOG_HTTP_PORT:8025" \
    mailhog/mailhog >/dev/null
fi

echo "The email app is running at http://localhost:$MAILHOG_HTTP_PORT"
''']

[tasks."app:backend"]
alias = "app_backend"
description = "Run the backend server"
run = [{ task = "worktree:guard" }, "go run ./server/cmd/main.go"]

# Native app tasks. The Capacitor projects in mobile/ wrap the built web
# bundle, so every sync rebuilds web/dist first. The bundle ships inside the
# binary with no dev-server proxy, so the API must be reachable from the
# device; syncs default to the production API and VITE_API_URL overrides it,
# e.g. for a local backend reachable from an emulator.

[tasks."mobile:sync"]
alias = "mobile_sync"
description = "Build the web app and copy it into the native projects"
dir = "mobile"
run = '''
#!/usr/bin/env bash
set -euo pipefail

bun install
bun install --cwd ../web
VITE_API_URL="${VITE_API_URL:-https://api.getstronger.studio}" npm --prefix ../web run build-only
bunx cap sync
'''

[tasks."app:ios"]
alias = "app_ios"
description = "Build and launch the iOS app in a simulator"
dir = "mobile"
run = [{ task = "mobile:sync" }, "bunx cap run ios"]

[tasks."app:android"]
alias = "app_android"
description = "Build and launch the Android app in an emulator"
dir = "mobile"
run = [{ task = "mobile:sync" }, "bunx cap run android"]

# Code quality tasks

[tasks.format]
description = "Format all code"
run = [
    { task = "format:web" },
    { task = "format:backend" },
]

[tasks."format:web"]
alias = "format_web"
description = "Format web code"
dir = "web"
run = ["bunx sort-package-json", "npm run format"]

[tasks."format:backend"]
alias = "format_backend"
description = "Format backend code"
run = ["goimports -w .", "gofumpt -l -w ."]

[tasks.lint]
description = "Lint all code"
run = [
    { task = "lint:web" },
    { task = "lint:protos" },
    { task = "lint:backend" },
]

[tasks."lint:web"]
alias = "lint_web"
description = "Lint web code"
dir = "web"
run = "npm run lint"

[tasks."lint:protos"]
alias = "lint_protos"
description = "Lint Protocol Buffer definitions"
run = "buf lint"

[tasks."lint:backend"]
alias = "lint_backend"
description = "Lint backend code"
# Resolved through mise rather than PATH: a system golangci-lint v1 shadows the
# version pinned above on some machines, and v1 refuses this v2 configuration.
#
# --allow-parallel-runners because golangci-lint otherwise takes a global file
# lock and exits non-zero the moment another worktree is linting, which on a
# machine running several agents is most of the time. The lock guards a shared
# cache; GOLANGCI_LINT_CACHE above gives each checkout its own.
run = '"$(mise which golangci-lint)" run --allow-parallel-runners'

[tasks.vet]
description = "Vet all code"
run = [{ task = "vet:go" }]

[tasks."vet:go"]
alias = "vet_go"
description = "Vet Go code"
run = "go vet ./..."

# Installation tasks

[tasks.install]
description = "Install dependencies, tools, and Git hooks"
run = [
    { task = "install:tools" },
    { task = "install:go" },
    { task = "install:js" },
    { task = "install:hooks" },
]

[tasks."install:go"]
alias = "install_go"
description = "Install Go dependencies"
run = ["go mod download", "go mod tidy"]

[tasks."install:js"]
alias = "install_js"
description = "Install JavaScript dependencies"
run = ["bun install", { task = "install:js:web" }, { task = "install:js:mobile" }]

[tasks."install:js:web"]
alias = "install_js_web"
description = "Install web dependencies"
hide = true
dir = "web"
run = "bun install"

[tasks."install:js:mobile"]
alias = "install_js_mobile"
description = "Install mobile dependencies"
hide = true
dir = "mobile"
run = "bun install"

[tasks."install:e2e"]
description = "Install the browsers used by end-to-end tests"
dir = "web"
run = "bunx playwright install chromium firefox webkit"

[tasks."install:tools"]
alias = "install_tools"
description = "Install the tools configured in mise.toml"
run = "mise install"

[tasks."install:hooks"]
alias = "install_hooks"
description = "Install the pre-push Git hook"
run = [
    # The installed hook is a shim that runs scripts/pre_push_hook.sh from the
    # repository, so this is the last time the hook needs installing: the
    # checks themselves are never copied out of the tree.
    #
    # Resolve the hook directory via Git so this also works from a worktree,
    # where .git is a file rather than a directory.
    '''
    hooks="$(git rev-parse --git-path hooks)"
    mkdir -p "$hooks"
    cp ./scripts/pre_push_shim.sh "$hooks/pre-push"
    chmod +x "$hooks/pre-push"
    ''',
    '''echo "✅  Installed pre-push hook"''',
]

# Design system tasks
#
# The design system is mirrored to Claude Design (claude.ai/design) so that its
# design agent builds with the app's real components. Everything below is the
# local half; the upload itself needs the DesignSync tool, so it runs from the
# '/design-sync' skill in Claude Code. See web/.design-sync/NOTES.md.

[tasks."design:build"]
alias = "design_build"
description = "Build the design system as a library into web/ds-dist"
dir = "web"
# The app is not a published library, so the converter has no entry to read and
# no types. This makes both with the app's own Vite and PostCSS config, which is
# also what expands the CSS Modules' @apply rules.
run = "node .design-sync/build-ds.mjs"

[tasks."design:bundle"]
alias = "design_bundle"
description = "Rebuild the Claude Design bundle in web/ds-bundle and validate it"
dir = "web"
# Needs the converter staged in web/.ds-sync, which the '/design-sync' skill
# puts there. It is gitignored, so a fresh clone runs the skill once first.
run = [
    { task = "design:build" },
    'test -d .ds-sync || { echo "✗ web/.ds-sync is missing — run /design-sync in Claude Code once to stage the converter." >&2; exit 1; }',
    "node .ds-sync/package-build.mjs --config .design-sync/config.json --node-modules ./node_modules --entry ./ds-dist/index.js --out ./ds-bundle",
    "node .ds-sync/package-validate.mjs ./ds-bundle",
    'echo "Look at the cards with: mise run design:review"',
]

[tasks."design:review"]
alias = "design_review"
description = "Serve the design system's preview cards for a look"
dir = "web"
run = "node .ds-sync/storybook/http-serve.mjs ./ds-bundle"

# Pull request tasks

[tasks."pr:create"]
description = "Open a pull request authored by the GitHub App"
usage = '''
arg "<title>" help="Pull request subject, in the same style as a commit subject"
arg "<body_file>" help="Path to a file holding the pull request body as Markdown"
flag "--base <base>" help="Branch to target instead of the default one, for a pull request stacked on another"
'''
run = './scripts/pr_create.sh "$usage_title" "$usage_body_file" ${usage_base+--base "$usage_base"}'

[tasks."pr:screenshots"]
description = "Publish a pull request's screenshots and print the markdown that shows them"
usage = '''
arg "<number>" help="Pull request the screenshots belong to"
flag "--path <path>" help="Directory to publish, defaulting to this ref's changes; anything outside web/screenshots is refused"
flag "--append" help="Append the markdown to the pull request body, replacing an earlier block"
'''
# The bucket name is deliberately absent from here: it is a GitHub repository
# variable, and locally it comes from .env. See the README's Scaleway section.
env = { _.file = ".env" }
run = './scripts/pr_screenshots.sh "$usage_number" ${usage_path+--path "$usage_path"} ${usage_append+--append}'

# Local development tasks

[tasks.env]
description = "Create local environment files when missing"
run = [
    "test -f .env || cp .env.example .env",
    "test -f web/.env || cp web/.env.example web/.env",
    { task = "worktree:env" },
]

[tasks."worktree:env"]
description = "Give this worktree its own ports, database, and containers"
run = "./scripts/worktree_env.sh"

[tasks."worktree:guard"]
description = "Fail when this worktree has no ports and containers of its own"
hide = true
run = "./scripts/worktree_guard.sh"

[tasks."worktree:prune"]
description = "List the containers left behind by removed worktrees, or remove them"
usage = 'flag "--force" help="Remove the containers instead of listing them"'
run = "./scripts/worktree_prune.sh"

[tasks."worktree:clean"]
description = "Stop this worktree's servers and containers, keeping its data"
run = "./scripts/worktree_clean.sh"

[tasks."worktree:sweep"]
description = "Free the worktrees whose directory is gone or whose pull request has merged"
run = "./scripts/worktree_sweep.sh"

[tasks.setup]
description = "Set up and run the local development environment"
run = [
    { task = "install" },
    { task = "env" },
    { task = "gen:certs" },
    { task = "db:init" },
    "sleep 1",
    { task = "db:migrate" },
    { task = "db:seed" },
    { task = "app" },
]

# Cleanup tasks

[tasks.clean]
description = "Remove local development resources"
run = [{ task = "db:clean" }, { task = "email:clean" }]

[tasks."email:clean"]
description = "Remove the local MailHog container"
run = [{ task = "worktree:guard" }, 'docker rm -f "$MAILHOG_CONTAINER" || true']

[tasks."db:clean"]
alias = "clean_db"
description = "Remove the local PostgreSQL container"
run = [{ task = "worktree:guard" }, 'docker rm -f "$DB_CONTAINER" || true']
