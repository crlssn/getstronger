version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  # bun, not npm: every JavaScript root here locks with bun.lock and CI installs
  # with --frozen-lockfile. The npm updater edits package.json and then looks for
  # a package-lock.json that does not exist, so it opened bumps no CI could pass.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
  - package-ecosystem: "bun"
    directory: "web"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 20
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 10
