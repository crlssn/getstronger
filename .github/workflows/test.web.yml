name: test web

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/test.web.yml'
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Run linter
        working-directory: ./web
        run: npm run lint

      - name: Run formatter
        working-directory: ./web
        run: npm run format

      - name: Check for uncommitted changes
        run: |
          if [[ $(git status --porcelain) ]]; then
            git diff
            exit 1
          fi

      - name: Run unit tests
        working-directory: ./web
        run: npm run test:unit -- --run --coverage

      - name: Build the app
        working-directory: ./web
        run: npm run build
