name: test web

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/test.web.yml'
      - 'web/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Run linter
        working-directory: ./web
        run: npm run lint

      - name: Run formatter
        working-directory: ./web
        run: npm run format

      - name: Check for uncommitted changes
        run: |
          if [[ $(git status --porcelain) ]]; then
            git diff
            exit 1
          fi

      # The junit reporter feeds Codecov Test Analytics; default keeps the job
      # log readable, since a reporter list replaces the built-in one.
      - name: Run unit tests
        working-directory: ./web
        run: >-
          npm run test:unit --
          --run --coverage
          --reporter=default --reporter=junit --outputFile.junit=junit.xml

      # Runs even when the suite fails, which is the run whose results matter.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          slug: crlssn/getstronger
          files: web/junit.xml
          report_type: test_results
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build the app
        working-directory: ./web
        run: npm run build
