name: test server

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/test.server.yml'
      - '.golangci.yml'
      - 'go.mod'
      - 'go.sum'
      - 'server/**'
      - 'scripts/**'
      - 'database/migrations/**'
      - '.github/workflows/test.server.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  server:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download modules
        run: go mod download

      - name: Install mockgen
        run: go install go.uber.org/mock/mockgen@v0.6.0

      - name: Generate code
        run: go generate ./...

      - name: Examine code
        run: go vet ./...

      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@v0.48.0

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@v0.10.0

      - name: Format code
        run: |
          goimports -w .
          gofumpt -l -w .

      - name: Check for uncommitted changes
        run: |
          if [[ $(git status --porcelain) ]]; then
            git diff
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

      - name: Run tests with coverage
        # -coverpkg makes a statement count wherever it is executed, so helpers
        # exercised only from another package's tests are not reported as 0%.
        # Scoped to ./server/... because all Go code and tests live there and
        # ./... would drag in the vendored Go package under web/node_modules.
        run: go test ./... -coverpkg=./server/... -coverprofile=coverage.out
        env:
          # Ten test binaries share one Ryuk container, and each waits up to a
          # hardcoded 60s for it to log that it started — a deadline a loaded
          # runner misses often enough to redden a green branch (#1161). The
          # runner is discarded after the job, so nothing here needs reaping.
          TESTCONTAINERS_RYUK_DISABLED: 'true'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v5.1.2
        with:
          slug: crlssn/getstronger
          files: coverage.out
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
