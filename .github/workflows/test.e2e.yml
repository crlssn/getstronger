name: test e2e

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/test.e2e.yml'
      - 'database/migrations/**'
      - 'server/**'
      - 'web/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Reads the Playwright version so the browser job can run in the matching
  # official image, which ships the browsers and their system libraries and
  # saves several minutes of downloads and apt installs per run. The version is
  # read from package.json rather than the lockfile because bun.lock is JSONC
  # and cannot be require()d; the dependency must therefore stay pinned to an
  # exact version, or the image tag below will not resolve.
  version:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      playwright: ${{ steps.playwright.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: web/package.json
          sparse-checkout-cone-mode: false

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

  # One runner per shard, each with a database and a stack of its own, so the
  # suite's wall-clock falls with the number of runners rather than with the
  # number of tests. Playwright decides what goes where; because the config
  # keeps `fullyParallel` off, it splits by spec file and project, which is the
  # unit that resets the seeded data. See web/CLAUDE.md.
  browser:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # A shard that fails says nothing about the others, and cancelling them
      # would hide the rest of the failures from the same push.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
      options: --user 1001
    env:
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      DB_HOST: postgres
      DB_NAME: postgres
      DB_PASSWORD: root
      DB_PORT: 5432
      DB_SSL_MODE: disable
      DB_USER: root
      EMAIL_PROVIDER: local
      ENV: local
      JWT_ACCESS_TOKEN_KEY: e2e-access-key
      JWT_REFRESH_TOKEN_KEY: e2e-refresh-key
      SERVER_PORT: 8080
      SSE_PORT: 8081
      USER_EMAIL: active@getstronger.test
      USER_NAME: Alex Morgan
      USER_PASSWORD: password123
      VITE_API_URL: http://localhost:8080

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: root
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      # Unlike the other workflows this one cannot use oven-sh/setup-bun: the
      # action unpacks a .zip, the Playwright image ships no unzip, and the job
      # runs as a non-root user so it cannot apt-get one. Bun's npm package
      # carries the binary as a per-platform optional dependency instead, and
      # --prefix keeps the install inside the writable home directory.
      - name: Set up Bun
        run: |
          npm install -g --prefix "$HOME/.local" bun@1.4.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Install database migration tool
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Create server environment
        run: |
          touch .env

      - name: Migrate database
        run: >-
          migrate -path database/migrations/
          -database "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"
          -verbose up

      # The suite seeds itself, once per run, in its global setup: see
      # web/tests/e2e/seed.ts.
      - name: Run end-to-end tests
        working-directory: web
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # Runs even when the suite fails, which is the run whose results matter.
      # Every shard uploads its own results and Codecov merges them by commit,
      # so Test Analytics still sees one run's worth of tests.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@1e68e06f1dbfde0e4cefc87efeba9e4643565303 # v5.1.2
        with:
          slug: crlssn/getstronger
          files: web/junit.xml
          report_type: test_results
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # A report per shard rather than one merged report: merging needs a job
      # of its own after every shard has finished, and the shard a failure
      # belongs to is the shard whose report you want to open anyway.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-report-${{ matrix.shard }}
          path: web/playwright-report/
          retention-days: 14
