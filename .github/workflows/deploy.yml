name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      migrate:
        description: Run pending database migrations
        required: true
        default: true
        type: boolean
      deploy_server:
        description: Deploy the API to the Scaleway Instance
        required: true
        default: true
        type: boolean
      deploy_web:
        description: Deploy the web app to Scaleway Object Storage
        required: true
        default: true
        type: boolean

concurrency:
  group: deployments
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  repository-projects: read

jobs:
  init:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy' && github.actor == 'crlssn')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      web: ${{ steps.changes.outputs.web }}
      server: ${{ steps.changes.outputs.server }}
      database: ${{ steps.changes.outputs.database }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          filters: |
            web: ['web/**']
            server: ['server/**', 'Dockerfile', '.dockerignore', 'Caddyfile', 'compose.yaml', 'go.mod', 'go.sum', 'mise.toml']
            database: ['database/**']

  database:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.init.outputs.database == 'true' || (github.event_name == 'workflow_dispatch' && inputs.migrate)
    env:
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_MIGRATION_USER: ${{ vars.DB_MIGRATION_USER }}
      DB_MIGRATION_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_BUCKET: ${{ vars.SCW_BUCKET }}
      SCW_REGION: ${{ vars.SCW_REGION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          wget https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.deb
          sudo dpkg -i migrate.linux-amd64.deb

      - name: Run migration
        run: |
          migrate -path database/migrations/ \
            -database "postgresql://${DB_MIGRATION_USER}:${DB_MIGRATION_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
            -verbose up

  server:
    needs: [init, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.init.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_server))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build --platform linux/amd64 --tag getstronger-api:latest .

      - name: Create deployment bundle
        env:
          API_DOMAIN: ${{ vars.API_DOMAIN }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ vars.DB_NAME }}
          CORS_ALLOWED_ORIGIN: ${{ vars.CORS_ALLOWED_ORIGIN }}
          SERVER_PORT: ${{ vars.SERVER_PORT }}
          COOKIE_DOMAIN: ${{ vars.COOKIE_DOMAIN }}
          JWT_ACCESS_TOKEN_KEY: ${{ secrets.JWT_ACCESS_TOKEN_KEY }}
          JWT_REFRESH_TOKEN_KEY: ${{ secrets.JWT_REFRESH_TOKEN_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM_ADDRESS: ${{ vars.EMAIL_FROM_ADDRESS }}
          SCW_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
          SCW_TEM_REGION: ${{ vars.SCW_TEM_REGION }}
          SCW_TEM_SECRET_KEY: ${{ secrets.SCW_TEM_SECRET_KEY }}
        run: |
          mkdir deployment
          cp Caddyfile compose.yaml deployment/
          docker save getstronger-api:latest | gzip -1 > deployment/getstronger-api.tar.gz

          {
            printf 'API_DOMAIN=%s\n' "$API_DOMAIN"
            printf 'ENV=production\n'
            printf 'DB_HOST=%s\n' "$DB_HOST"
            printf 'DB_PORT=%s\n' "$DB_PORT"
            printf 'DB_USER=%s\n' "$DB_USER"
            printf 'DB_PASSWORD=%s\n' "$DB_PASSWORD"
            printf 'DB_NAME=%s\n' "$DB_NAME"
            printf 'CORS_ALLOWED_ORIGIN=%s\n' "$CORS_ALLOWED_ORIGIN"
            printf 'SERVER_PORT=%s\n' "$SERVER_PORT"
            printf 'COOKIE_DOMAIN=%s\n' "$COOKIE_DOMAIN"
            printf 'JWT_ACCESS_TOKEN_KEY=%s\n' "$JWT_ACCESS_TOKEN_KEY"
            printf 'JWT_REFRESH_TOKEN_KEY=%s\n' "$JWT_REFRESH_TOKEN_KEY"
            printf 'EMAIL_PROVIDER=%s\n' "$EMAIL_PROVIDER"
            printf 'EMAIL_FROM_ADDRESS=%s\n' "$EMAIL_FROM_ADDRESS"
            printf 'SCW_PROJECT_ID=%s\n' "$SCW_PROJECT_ID"
            printf 'SCW_TEM_REGION=%s\n' "$SCW_TEM_REGION"
            printf 'SCW_TEM_SECRET_KEY=%s\n' "$SCW_TEM_SECRET_KEY"
          } > deployment/.env

          chmod 600 deployment/.env

      - name: Deploy to Scaleway Instance
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447 # v6.0.3
        with:
          REMOTE_HOST: ${{ vars.SCW_INSTANCE_HOST }}
          REMOTE_USER: ${{ vars.SCW_INSTANCE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SCW_INSTANCE_SSH_KEY }}
          SOURCE: 'deployment/'
          TARGET: ${{ vars.SCW_INSTANCE_APP_DIR }}

      - name: Load and restart containers
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ vars.SCW_INSTANCE_HOST }}
          username: ${{ vars.SCW_INSTANCE_USER }}
          key: ${{ secrets.SCW_INSTANCE_SSH_KEY }}
          port: 22
          script: |
            set -eu
            cd "${{ vars.SCW_INSTANCE_APP_DIR }}"
            chmod 600 .env
            previous_api_image="$(docker image inspect --format='{{.Id}}' getstronger-api:latest 2>/dev/null || true)"
            gzip --decompress --stdout getstronger-api.tar.gz | docker load
            current_api_image="$(docker image inspect --format='{{.Id}}' getstronger-api:latest)"
            docker compose config --quiet
            docker compose pull caddy
            docker compose up --detach --force-recreate --remove-orphans

            attempts=0
            status=starting
            while [ "$attempts" -lt 30 ]; do
              status="$(docker inspect --format='{{.State.Health.Status}}' getstronger-api 2>/dev/null || true)"
              if [ "$status" = healthy ]; then
                break
              fi
              if [ "$status" = unhealthy ]; then
                docker compose logs --no-color api
                exit 1
              fi
              attempts=$((attempts + 1))
              sleep 2
            done

            if [ "$status" != healthy ]; then
              docker compose logs --no-color api
              exit 1
            fi

            attempts=0
            caddy_running=false
            while [ "$attempts" -lt 15 ]; do
              caddy_running="$(docker inspect --format='{{.State.Running}}' getstronger-caddy 2>/dev/null || true)"
              if [ "$caddy_running" = true ]; then
                break
              fi
              attempts=$((attempts + 1))
              sleep 2
            done

            if [ "$caddy_running" != true ]; then
              docker compose logs --no-color caddy
              exit 1
            fi

            if [ -n "$previous_api_image" ] && [ "$previous_api_image" != "$current_api_image" ]; then
              docker image rm "$previous_api_image" || true
            fi

  web:
    needs: [init, database, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      always() &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.server.result == 'success' || needs.server.result == 'skipped') &&
      (needs.init.outputs.web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_web))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: web/package-lock.json
          node-version: '24.19.0'

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Build the app
        working-directory: ./web
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Scaleway Object Storage
        working-directory: ./web
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SCW_REGION }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_BUCKET_NAME: ${{ vars.SCW_BUCKET_NAME }}
        run: |
          aws s3 sync ./dist "s3://${SCW_BUCKET_NAME}" \
            --endpoint-url "https://s3.${SCW_REGION}.scw.cloud"

  cleanup:
    needs: [init, database, server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove deploy label
        if: github.event_name == 'pull_request' && github.event.label.name == 'deploy'
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label "deploy"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
