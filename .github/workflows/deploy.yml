# Deploys the database, API, and web app to one of two environments. Neither is
# reached by merging: beta is asked for, by labelling a pull request or by a
# manual run, and production is promoted by publishing a release, so nothing
# reaches users without a deliberate act.
name: deploy

on:
  release:
    types:
      - published
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: beta
        type: choice
        options:
          - beta
          - production
      migrate:
        description: Run pending database migrations
        required: true
        default: true
        type: boolean
      seed:
        description: Reseed the database (beta only, wipes its data)
        required: true
        default: true
        type: boolean
      deploy_server:
        description: Deploy the API to Scaleway Serverless Containers
        required: true
        default: true
        type: boolean
      deploy_web:
        description: Deploy the web app to Scaleway Object Storage
        required: true
        default: true
        type: boolean

# Per environment, so a beta deploy never queues behind a production one. Keep
# this in step with the `init` job's environment output; workflow-level
# concurrency cannot read job outputs, so the rule is spelled out twice.
concurrency:
  group: deployments-${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) && 'production' || 'beta' }}
  cancel-in-progress: false

# A pull_request run checks out an ephemeral merge commit whose SHA exists
# nowhere afterwards, which is no use as an image tag or as an answer to what a
# container is running. Deploy the branch itself; every other event already
# points at a real commit.
env:
  DEPLOY_REF: ${{ github.event.pull_request.head.sha || github.sha }}

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  repository-projects: read

jobs:
  init:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy:beta' && github.actor == 'crlssn')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      environment: ${{ steps.target.outputs.environment }}
      # A release and a labelled pull request deploy every component: a release
      # usually spans several merges, and a label is asking to see that branch
      # on beta — neither wants an environment running half of one revision and
      # half of another. A manual run deploys by its inputs, which is why these
      # are left empty for it. A label reseeds too: it asks for that branch on a
      # beta nobody has been poking at.
      web: ${{ (github.event_name == 'release' || github.event_name == 'pull_request') && 'true' || '' }}
      server: ${{ (github.event_name == 'release' || github.event_name == 'pull_request') && 'true' || '' }}
      database: ${{ (github.event_name == 'release' || github.event_name == 'pull_request') && 'true' || '' }}
      seed: ${{ (github.event_name == 'release' || github.event_name == 'pull_request') && 'true' || '' }}

    steps:
      - name: Resolve the target environment
        id: target
        env:
          ENVIRONMENT: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) && 'production' || 'beta' }}
        run: |
          echo "Deploying to ${ENVIRONMENT}"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

  # Every stage lives in one job because a protected environment is approved per
  # job: as four jobs, one production deploy asked for four approvals of the
  # same decision. The stages were nearly serial anyway — only the beta reseed
  # ran beside anything — so the cost is re-running the whole deploy rather than
  # the stage that failed. Migrating is a no-op when nothing is pending and
  # redeploying a commit already deployed changes nothing, so a re-run is safe.
  deploy:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: >-
      needs.init.outputs.database == 'true' ||
      needs.init.outputs.server == 'true' ||
      needs.init.outputs.web == 'true' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.migrate || inputs.seed || inputs.deploy_server || inputs.deploy_web))
    environment: ${{ needs.init.outputs.environment }}

    env:
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
      EXPECTED_ENVIRONMENT: ${{ needs.init.outputs.environment }}
      IMAGE: rg.fr-par.scw.cloud/getstronger/server
      # What this run deploys, resolved once so each stage below reads as a
      # name rather than as the expression that selected it.
      RUN_MIGRATE: ${{ (needs.init.outputs.database == 'true' || (github.event_name == 'workflow_dispatch' && inputs.migrate)) && 'true' || '' }}
      RUN_SEED: ${{ (needs.init.outputs.environment == 'beta' && (github.event_name != 'workflow_dispatch' || inputs.seed)) && 'true' || '' }}
      RUN_SERVER: ${{ (needs.init.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_server)) && 'true' || '' }}
      RUN_WEB: ${{ (needs.init.outputs.web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_web)) && 'true' || '' }}

    steps:
      # An environment without variables of its own falls back to repository
      # scope, so a half-configured beta would quietly deploy to production.
      # Each environment names itself in DEPLOY_ENVIRONMENT to rule that out.
      - name: Verify the environment is configured
        run: |
          if [ "$DEPLOY_ENVIRONMENT" != "$EXPECTED_ENVIRONMENT" ]; then
            echo "::error::Expected the ${EXPECTED_ENVIRONMENT} environment, but DEPLOY_ENVIRONMENT is '${DEPLOY_ENVIRONMENT:-unset}'. Configure the ${EXPECTED_ENVIRONMENT} GitHub Environment before deploying."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_REF }}

      - name: Install golang-migrate
        if: env.RUN_MIGRATE == 'true'
        run: |
          wget https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.deb
          sudo dpkg -i migrate.linux-amd64.deb

      - name: Run migration
        if: env.RUN_MIGRATE == 'true'
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_MIGRATION_USER: ${{ vars.DB_MIGRATION_USER }}
          DB_MIGRATION_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}
        run: |
          migrate -path database/migrations/ \
            -database "postgresql://${DB_MIGRATION_USER}:${DB_MIGRATION_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
            -verbose up

      # Beta is a demo environment, so every beta deploy reseeds it: it shows the
      # personas that revision describes rather than whatever the last person
      # testing it left behind. Reseeding is destructive, so RUN_SEED and the
      # environment check confine the truncate to beta, the seed refuses any ENV
      # it may not wipe, and a manual run can decline it outright.
      - name: Set up Go
        if: env.RUN_SEED == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # The migration user, because seeding truncates and rewrites every table.
      # ENV carries the resolved environment, so the seed's own guard checks
      # the same fact that selected the credentials.
      - name: Seed the database
        if: env.RUN_SEED == 'true'
        env:
          ENV: ${{ needs.init.outputs.environment }}
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_MIGRATION_USER }}
          DB_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          # The seeded logins are publicly reachable, so the seed refuses its
          # published local default password outside local.
          if [ -z "$SEED_PASSWORD" ]; then
            echo "::error::Set the SEED_PASSWORD secret on the beta environment."
            exit 1
          fi
          go run ./server/testing/factory/seed -password="$SEED_PASSWORD"

      - name: Log in to Scaleway Container Registry
        if: env.RUN_SERVER == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      # Only the commit tag is published. No environment shares a moving tag
      # with another, so nothing can roll out to the wrong one.
      - name: Build API image
        if: env.RUN_SERVER == 'true'
        run: docker build --platform linux/amd64 --tag "$IMAGE:$DEPLOY_REF" .

      - name: Push API image to Scaleway Container Registry
        if: env.RUN_SERVER == 'true'
        run: docker push "$IMAGE:$DEPLOY_REF"

      - name: Deploy the Serverless Container
        if: env.RUN_SERVER == 'true'
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
        run: |
          container_url="https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/${SCW_CONTAINER_ID}"

          # Point the container at this commit's image. What a container runs is
          # then a fact rather than whatever a moving tag pointed at when it last
          # pulled, and a rollback is this same field set to an earlier commit.
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request PATCH \
            --header "X-Auth-Token: $SCW_SECRET_KEY" \
            --header 'Content-Type: application/json' \
            --data "$(jq --null-input --arg image "$IMAGE:$DEPLOY_REF" '{registry_image: $image}')" \
            "$container_url")"
          if [ "$code" = 409 ]; then
            echo "::error::The container is mid-deployment and would not accept the image update. Re-run once it settles."
            exit 1
          fi
          if [ "${code#2}" = "$code" ]; then
            echo "::error::Updating the container image failed with HTTP $code"
            exit 1
          fi

          # Changing the image deploys on its own, and asking again while that
          # runs is a 409. Redeploying the same commit changes nothing, though,
          # so the request still has to be made — and its 409 ignored.
          code="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${container_url}/deploy")"
          if [ "$code" != 409 ] && [ "${code#2}" = "$code" ]; then
            echo "::error::Requesting the deployment failed with HTTP $code"
            exit 1
          fi

          attempts=0
          status=pending
          while [ "$attempts" -lt 60 ]; do
            # Read after the pause, never before it: a deployment that has only
            # just been asked for still reports the previous revision as ready.
            sleep 5
            status="$(curl --silent --show-error --fail \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "$container_url" | jq -r '.status')"
            if [ "$status" = ready ]; then
              break
            fi
            if [ "$status" = error ]; then
              curl --silent --header "X-Auth-Token: $SCW_SECRET_KEY" "$container_url" | jq -r '.error_message'
              exit 1
            fi
            attempts=$((attempts + 1))
          done

          if [ "$status" != ready ]; then
            echo "Container did not become ready in time (last status: $status)"
            exit 1
          fi

      - name: Set up Node.js
        if: env.RUN_WEB == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      - name: Set up Bun
        if: env.RUN_WEB == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        if: env.RUN_WEB == 'true'
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Build the app
        if: env.RUN_WEB == 'true'
        working-directory: ./web
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: Deploy to Scaleway Object Storage
        if: env.RUN_WEB == 'true'
        working-directory: ./web
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SCW_REGION }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_BUCKET_NAME: ${{ vars.SCW_BUCKET_NAME }}
        # Hashed bundles are uploaded first so index.html never references
        # missing files, and stale objects are pruned with --delete.
        run: |
          aws s3 sync ./dist/assets "s3://${SCW_BUCKET_NAME}/assets" \
            --endpoint-url "https://s3.${SCW_REGION}.scw.cloud" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync ./dist "s3://${SCW_BUCKET_NAME}" \
            --endpoint-url "https://s3.${SCW_REGION}.scw.cloud" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

  cleanup:
    needs: [init, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'deploy:beta'

    steps:
      - name: Remove deploy label
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label "deploy:beta"
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
