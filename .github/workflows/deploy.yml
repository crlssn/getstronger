# Deploys the database, API, and web app to one of two environments. A merge to
# `main` reaches beta only; production is promoted by publishing a release, so
# nothing reaches users without a deliberate act.
name: deploy

on:
  push:
    branches:
      - main
  release:
    types:
      - published
  pull_request:
    types:
      - labeled
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        required: true
        default: beta
        type: choice
        options:
          - beta
          - production
      migrate:
        description: Run pending database migrations
        required: true
        default: true
        type: boolean
      deploy_server:
        description: Deploy the API to Scaleway Serverless Containers
        required: true
        default: true
        type: boolean
      deploy_web:
        description: Deploy the web app to Scaleway Object Storage
        required: true
        default: true
        type: boolean

# Per environment, so a beta deploy never queues behind a production one. Keep
# this in step with the `init` job's environment output; workflow-level
# concurrency cannot read job outputs, so the rule is spelled out twice.
concurrency:
  group: deployments-${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) && 'production' || 'beta' }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  repository-projects: read

jobs:
  init:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy' && github.actor == 'crlssn')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      environment: ${{ steps.target.outputs.environment }}
      # A release deploys every component. It usually spans several merges, and
      # a full deploy is the safer default for a rare, deliberate promotion.
      web: ${{ github.event_name == 'release' && 'true' || steps.changes.outputs.web }}
      server: ${{ github.event_name == 'release' && 'true' || steps.changes.outputs.server }}
      database: ${{ github.event_name == 'release' && 'true' || steps.changes.outputs.database }}

    steps:
      - name: Resolve the target environment
        id: target
        env:
          ENVIRONMENT: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')) && 'production' || 'beta' }}
        run: |
          echo "Deploying to ${ENVIRONMENT}"
          echo "environment=${ENVIRONMENT}" >> "$GITHUB_OUTPUT"

      - name: Checkout code
        if: github.event_name != 'release'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On push, diff against the last successful push deploy rather than only
      # the pushed commits, so changes from a failed deploy are retried on the
      # next push instead of being silently dropped. Pushes only ever deploy to
      # beta, so this lookup is a beta-only question.
      - name: Find last successful beta deploy
        id: last-deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/deploy.yml/runs?branch=main&event=push&status=success&per_page=1" \
            --jq '.workflow_runs[0].head_sha // empty')"
          echo "Last successful deploy: ${sha:-none}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check for changes
        id: changes
        if: github.event_name != 'release'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: ${{ steps.last-deploy.outputs.sha }}
          filters: |
            web: ['web/**']
            server: ['server/**', 'Dockerfile', '.dockerignore', 'go.mod', 'go.sum', 'mise.toml']
            database: ['database/**']

  database:
    needs: init
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: needs.init.outputs.database == 'true' || (github.event_name == 'workflow_dispatch' && inputs.migrate)
    environment: ${{ needs.init.outputs.environment }}
    env:
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
      EXPECTED_ENVIRONMENT: ${{ needs.init.outputs.environment }}
      DB_HOST: ${{ vars.DB_HOST }}
      DB_PORT: ${{ vars.DB_PORT }}
      DB_NAME: ${{ vars.DB_NAME }}
      DB_MIGRATION_USER: ${{ vars.DB_MIGRATION_USER }}
      DB_MIGRATION_PASSWORD: ${{ secrets.DB_MIGRATION_PASSWORD }}

    steps:
      # An environment without variables of its own falls back to repository
      # scope, so a half-configured beta would quietly deploy to production.
      # Each environment names itself in DEPLOY_ENVIRONMENT to rule that out.
      - name: Verify the environment is configured
        run: |
          if [ "$DEPLOY_ENVIRONMENT" != "$EXPECTED_ENVIRONMENT" ]; then
            echo "::error::Expected the ${EXPECTED_ENVIRONMENT} environment, but DEPLOY_ENVIRONMENT is '${DEPLOY_ENVIRONMENT:-unset}'. Configure the ${EXPECTED_ENVIRONMENT} GitHub Environment before deploying."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install golang-migrate
        run: |
          wget https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.deb
          sudo dpkg -i migrate.linux-amd64.deb

      - name: Run migration
        run: |
          migrate -path database/migrations/ \
            -database "postgresql://${DB_MIGRATION_USER}:${DB_MIGRATION_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
            -verbose up

  server:
    needs: [init, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      always() &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.init.outputs.server == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_server))
    environment: ${{ needs.init.outputs.environment }}

    env:
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
      EXPECTED_ENVIRONMENT: ${{ needs.init.outputs.environment }}
      IMAGE: rg.fr-par.scw.cloud/getstronger/server
      # Production keeps the `latest` tag its container was configured with;
      # beta publishes under its own tag so the two never pull each other's
      # image from the shared registry namespace.
      TAG: ${{ needs.init.outputs.environment == 'production' && 'latest' || 'beta' }}

    steps:
      - name: Verify the environment is configured
        run: |
          if [ "$DEPLOY_ENVIRONMENT" != "$EXPECTED_ENVIRONMENT" ]; then
            echo "::error::Expected the ${EXPECTED_ENVIRONMENT} environment, but DEPLOY_ENVIRONMENT is '${DEPLOY_ENVIRONMENT:-unset}'. Configure the ${EXPECTED_ENVIRONMENT} GitHub Environment before deploying."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Scaleway Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: rg.fr-par.scw.cloud
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Build API image
        run: docker build --platform linux/amd64 --tag "$IMAGE:$TAG" --tag "$IMAGE:$GITHUB_SHA" .

      - name: Push API image to Scaleway Container Registry
        run: |
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:$GITHUB_SHA"

      - name: Deploy the Serverless Container
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_CONTAINER_ID: ${{ vars.SCW_CONTAINER_ID }}
        run: |
          container_url="https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/${SCW_CONTAINER_ID}"

          curl --silent --show-error --fail \
            --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "${container_url}/deploy" > /dev/null

          attempts=0
          status=pending
          while [ "$attempts" -lt 60 ]; do
            status="$(curl --silent --show-error --fail \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "$container_url" | jq -r '.status')"
            if [ "$status" = ready ]; then
              break
            fi
            if [ "$status" = error ]; then
              curl --silent --header "X-Auth-Token: $SCW_SECRET_KEY" "$container_url" | jq -r '.error_message'
              exit 1
            fi
            attempts=$((attempts + 1))
            sleep 5
          done

          if [ "$status" != ready ]; then
            echo "Container did not become ready in time (last status: $status)"
            exit 1
          fi

  web:
    needs: [init, database, server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      always() &&
      (needs.database.result == 'success' || needs.database.result == 'skipped') &&
      (needs.server.result == 'success' || needs.server.result == 'skipped') &&
      (needs.init.outputs.web == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_web))
    environment: ${{ needs.init.outputs.environment }}

    env:
      DEPLOY_ENVIRONMENT: ${{ vars.DEPLOY_ENVIRONMENT }}
      EXPECTED_ENVIRONMENT: ${{ needs.init.outputs.environment }}

    steps:
      - name: Verify the environment is configured
        run: |
          if [ "$DEPLOY_ENVIRONMENT" != "$EXPECTED_ENVIRONMENT" ]; then
            echo "::error::Expected the ${EXPECTED_ENVIRONMENT} environment, but DEPLOY_ENVIRONMENT is '${DEPLOY_ENVIRONMENT:-unset}'. Configure the ${EXPECTED_ENVIRONMENT} GitHub Environment before deploying."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install dependencies
        working-directory: ./web
        run: bun install --frozen-lockfile

      - name: Build the app
        working-directory: ./web
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}

      - name: Deploy to Scaleway Object Storage
        working-directory: ./web
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SCW_REGION }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_BUCKET_NAME: ${{ vars.SCW_BUCKET_NAME }}
        # Hashed bundles are uploaded first so index.html never references
        # missing files, and stale objects are pruned with --delete.
        run: |
          aws s3 sync ./dist/assets "s3://${SCW_BUCKET_NAME}/assets" \
            --endpoint-url "https://s3.${SCW_REGION}.scw.cloud" \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

          aws s3 sync ./dist "s3://${SCW_BUCKET_NAME}" \
            --endpoint-url "https://s3.${SCW_REGION}.scw.cloud" \
            --delete \
            --exclude "assets/*" \
            --cache-control "no-cache"

  cleanup:
    needs: [init, database, server, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always() && github.event_name == 'pull_request' && github.event.label.name == 'deploy'

    steps:
      - name: Remove deploy label
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label "deploy"
        env:
          GH_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
