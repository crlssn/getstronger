name: deploy

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled

concurrency:
  group: deployments
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  checks: read
  statuses: read
  actions: read
  repository-projects: read

jobs:
  init:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.label.name == 'deploy' && github.actor == 'crlssn')
    runs-on: ubuntu-latest

    outputs:
      web: ${{ steps.changes.outputs.web }}
      server: ${{ steps.changes.outputs.server }}
      database: ${{ steps.changes.outputs.database }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            web: ['web/**']
            server: ['server/**']
            database: ['database/**']

  database:
    needs: init
    runs-on: ubuntu-latest
    if: needs.init.outputs.database == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install golang-migrate
        run: |
          wget https://github.com/golang-migrate/migrate/releases/latest/download/migrate.linux-amd64.deb
          sudo dpkg -i migrate.linux-amd64.deb

      - name: Run migration
        env:
          DB_HOST: ${{ vars.DB_HOST }}
          DB_PORT: ${{ vars.DB_PORT }}
          DB_NAME: ${{ vars.DB_NAME }}
          DB_USER: ${{ vars.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        run: |
          migrate -path database/migrations/ \
            -database "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require" \
            -verbose up

  server:
    needs: [init, database]
    runs-on: ubuntu-latest
    if: always() && needs.database.result != 'failure' && needs.init.outputs.server == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build binary
        working-directory: ./server
        run: |
          go mod download
          GOOS=linux go build -o bin/app cmd/main.go

      - name: Create env file
        working-directory: ./server/bin
        run: |
          {
            echo ENV=production
            echo DB_HOST=${{ vars.DB_HOST }}
            echo DB_PORT=${{ vars.DB_PORT }}
            echo DB_USER=${{ vars.DB_USER }}
            echo DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            echo DB_NAME=${{ vars.DB_NAME }}
            echo CORS_ALLOWED_ORIGIN=${{ vars.CORS_ALLOWED_ORIGIN }}
            echo SERVER_PORT=${{ vars.SERVER_PORT }}
            echo SERVER_CERT_PATH=${{ vars.SERVER_CERT_PATH }}
            echo SERVER_KEY_PATH=${{ vars.SERVER_KEY_PATH }}
            echo COOKIE_DOMAIN=${{ vars.COOKIE_DOMAIN }}
            echo JWT_ACCESS_TOKEN_KEY=${{ secrets.JWT_ACCESS_TOKEN_KEY }}
            echo JWT_REFRESH_TOKEN_KEY=${{ secrets.JWT_REFRESH_TOKEN_KEY }}
            echo EMAIL_PROVIDER=${{ vars.EMAIL_PROVIDER }}
          } >> .env

      - name: Deploy to Scaleway Instance
        uses: easingthemes/ssh-deploy@ece05a22752e524363164bfb2f69a5ba4f8ded0d # v5.1.0
        with:
          REMOTE_HOST: ${{ vars.SCW_INSTANCE_HOST }}
          REMOTE_USER: ${{ vars.SCW_INSTANCE_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SCW_INSTANCE_SSH_KEY }}
          SOURCE: 'server/bin/'
          TARGET: ${{ vars.SCW_INSTANCE_APP_DIR }}

      - name: Restart service
        uses: appleboy/ssh-action@7eaf76671a0d7eec5d98ee897acda4f968735a17 # v1.2.0
        with:
          host: ${{ vars.SCW_INSTANCE_HOST }}
          username: ${{ vars.SCW_INSTANCE_USER }}
          key: ${{ secrets.SCW_INSTANCE_SSH_KEY }}
          port: 22
          script: |
            cd "${{ vars.SCW_INSTANCE_APP_DIR }}"
            sudo systemctl restart app.service

  web:
    needs: [init, server]
    runs-on: ubuntu-latest
    if: always() && needs.server.result != 'failure' && needs.init.outputs.web == 'true'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./web
        run: npm install

      - name: Build the app
        working-directory: ./web
        run: npm run build
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Deploy to Scaleway Object Storage
        working-directory: ./web
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.SCW_REGION }}
          SCW_REGION: ${{ vars.SCW_REGION }}
          SCW_BUCKET_NAME: ${{ vars.SCW_BUCKET_NAME }}
        run: |
          aws s3 sync ./dist "s3://$SCW_BUCKET_NAME" \
            --delete \
            --endpoint-url "https://s3.${SCW_REGION}.scw.cloud"

  cleanup:
    needs: [init, database, server, web]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove deploy label
        if: github.event_name == 'pull_request' && github.event.label.name == 'deploy'
        run: gh pr edit ${{ github.event.pull_request.number }} --remove-label "deploy"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
