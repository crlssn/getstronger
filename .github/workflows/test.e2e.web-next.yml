name: test e2e web-next

# Mirrors 'test e2e' for the React app being built alongside the Vue one
# (issue #1100). Delete this workflow when web-next/ replaces web/ and the
# 'test e2e' workflow covers the React app instead.

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    paths:
      - '.github/workflows/test.e2e.web-next.yml'
      - 'database/migrations/**'
      - 'server/**'
      - 'web-next/**'
      - 'go.mod'
      - 'go.sum'
      - 'mise.toml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Reads the Playwright version so the browser job can run in the matching
  # official image, which ships the browsers and their system libraries and
  # saves several minutes of downloads and apt installs per run.
  version:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      playwright: ${{ steps.playwright.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: web-next/package-lock.json
          sparse-checkout-cone-mode: false

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web-next/package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

  browser:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.version.outputs.playwright }}-noble
      options: --user 1001
    env:
      CORS_ALLOWED_ORIGIN: http://localhost:5173
      DB_HOST: postgres
      DB_NAME: postgres
      DB_PASSWORD: root
      DB_PORT: 5432
      DB_SSL_MODE: disable
      DB_USER: root
      EMAIL_PROVIDER: local
      ENV: local
      JWT_ACCESS_TOKEN_KEY: e2e-access-key
      JWT_REFRESH_TOKEN_KEY: e2e-refresh-key
      SERVER_PORT: 8080
      SSE_PORT: 8081
      USER_EMAIL: active@getstronger.test
      USER_NAME: Alex Morgan
      USER_PASSWORD: password123
      VITE_API_URL: http://localhost:8080

    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: root
        options: >-
          --health-cmd "pg_isready -U root -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          cache: npm
          cache-dependency-path: web-next/package-lock.json
          node-version: '24.19.0'

      - name: Install web dependencies
        working-directory: web-next
        run: npm ci

      - name: Install database migration tool
        run: |
          go install -tags postgres github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Create server environment
        run: |
          touch .env

      - name: Migrate database
        run: >-
          migrate -path database/migrations/
          -database "postgresql://${DB_USER}:${DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE}"
          -verbose up

      - name: Seed test data
        run: >-
          go run server/testing/factory/seed/main.go
          -email="${USER_EMAIL}"
          -password="${USER_PASSWORD}"
          -name="${USER_NAME}"

      - name: Run end-to-end tests
        working-directory: web-next
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: ignore
          name: playwright-report-web-next
          path: web-next/playwright-report/
          retention-days: 14
