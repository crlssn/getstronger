# Builds the native apps and uploads them to TestFlight and Play internal
# testing. Manual trigger only: releases are a deliberate act, and the workflow
# needs the signing secrets documented in the README (Native mobile apps →
# Releasing) before its first run can succeed.
name: release-mobile

on:
  workflow_dispatch:
    inputs:
      ios:
        description: Build and upload iOS to TestFlight
        required: true
        default: true
        type: boolean
      android:
        description: Build and upload Android to Play internal testing
        required: true
        default: true
        type: boolean
      play_upload:
        description: Publish the Android bundle to Play (off for the first build, which Play wants by hand)
        required: true
        default: true
        type: boolean

concurrency:
  group: release-mobile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The native apps ship against production, so the bundle is built with the
    # production environment's variables rather than the repository's.
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Build the web bundle
        working-directory: web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_POSTHOG_KEY: ${{ vars.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ vars.VITE_POSTHOG_HOST }}
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  ios:
    if: inputs.ios
    needs: web
    # App Store Connect rejects an upload built with anything below the iOS 26
    # SDK, which means Xcode 26 and so the macOS 26 image. Pinned rather than
    # macos-latest so a runner rollover cannot change the SDK under us.
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Sync the native project
        working-directory: mobile
        run: bunx cap sync ios

      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_PRIVATE_KEY" > ~/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8

      # Cloud signing minted a certificate on every run, because a fresh runner
      # has an empty keychain, until the account hit Apple's cap and every
      # release failed. Signing against a stored certificate costs no quota.
      - name: Install the signing certificate and profile
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -f pkcs12
          # codesign otherwise blocks on a keychain prompt nobody can answer,
          # which hangs the runner until the job times out.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db

          profile="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > "$profile"
          decoded="$(security cms -D -i "$profile")"
          uuid="$(printf '%s' "$decoded" | plutil -extract UUID raw -)"

          # Xcode 16 moved the directory it reads profiles from. Both are
          # written, so a runner image rollover cannot lose the profile.
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done

          # The profile carries its own name, so recreating it in the portal
          # needs no change to the project or this workflow.
          printf 'RELEASE_PROVISIONING_PROFILE=%s\n' \
            "$(printf '%s' "$decoded" | plutil -extract Name raw -)" >> "$GITHUB_ENV"

      - name: Archive
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" archive \
            DEVELOPMENT_TEAM='${{ vars.APPLE_TEAM_ID }}' \
            RELEASE_PROVISIONING_PROFILE="$RELEASE_PROVISIONING_PROFILE" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Upload to TestFlight
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>studio.getstronger.app</key>
              <string>$RELEASE_PROVISIONING_PROFILE</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ vars.ASC_KEY_ID }}.p8 \
            -authenticationKeyID '${{ vars.ASC_KEY_ID }}' \
            -authenticationKeyIssuerID '${{ vars.ASC_ISSUER_ID }}'

  android:
    if: inputs.android
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'

      # Bun installs the dependencies; the scripts themselves still run on Node.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'

      # Gradle downloads its distribution and every Android dependency on a cold
      # runner, which is most of this job. The key follows the two lockfiles as
      # well as the build scripts, because a dependency bump moves only those.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            mobile/android/**/*.gradle
            mobile/android/**/*.lockfile
            mobile/android/gradle/wrapper/gradle-wrapper.properties

      - name: Download web bundle
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Install mobile dependencies
        working-directory: mobile
        run: bun install --frozen-lockfile

      - name: Sync the native project
        working-directory: mobile
        run: bunx cap sync android

      - name: Build the release bundle
        working-directory: mobile/android
        run: ./gradlew bundleRelease -PversionCode=${{ github.run_number }}

      - name: Sign the release bundle
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          # A variable, not a secret: the alias names the key rather than
          # opening it, keytool -list reads it off the keystore anyway, and
          # masking a word as common as 'upload' punches holes in the log.
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          # jarsigner prompts for the key password whenever it differs from the
          # store password, which hangs the runner until the job times out.
          jarsigner -keystore "$RUNNER_TEMP/release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
            mobile/android/app/build/outputs/bundle/release/app-release.aab \
            "$ANDROID_KEY_ALIAS"

      # Play refuses an API publish until a new app's first bundle has been
      # uploaded through the Console by hand, so that run needs a way out of CI.
      - name: Upload the signed bundle
        uses: actions/upload-artifact@v7
        with:
          name: android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: Upload to Play internal testing
        if: inputs.play_upload
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: studio.getstronger.app
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
